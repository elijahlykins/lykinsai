# =====================================================================
# render.yaml — Render service blueprint
# =====================================================================
# Drives the always-on web service and retained operational jobs.
# `render.yaml` is read on dashboard sync.
#
# Required environment variables (set in the Render dashboard, NOT
# here, since they're secrets):
#   • VITE_SUPABASE_URL
#   • SUPABASE_SERVICE_ROLE_KEY
#   • ANTHROPIC_API_KEY
#   • OPENAI_API_KEY

services:
  # -------------------------------------------------------------------
  # Web service — the existing express server in server.js.
  # -------------------------------------------------------------------
  - type: web
    name: lykinsai-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run server
    autoDeploy: true
    healthCheckPath: /api/health

  # -------------------------------------------------------------------
  # Vault upload reconciler — runs jobs/runVaultReconciler.js.
  # -------------------------------------------------------------------
  # Backstop for the orphaned-upload race (migrations 111/112). `--apply`
  # backfills storage_path from the content marker, flags rows whose storage
  # object is missing as upload_state='missing', and SAFELY reaps abandoned
  # in-flight uploads via the upload ledger. The DESTRUCTIVE reverse-scan
  # leaked-file sweep stays OFF here — it requires VAULT_RECONCILER_DELETE_ENABLED=1
  # AND an explicit --delete-leaked, neither of which is set, so this run is
  # non-destructive (mark + safe ledger reap only).
  #
  # Schedule: 04:00 UTC. Runtime budget at current scale: a couple of
  # minutes (one RPC + a table scan).
  - type: cron
    name: lykinsai-vault-reconciler-nightly
    runtime: node
    plan: starter
    schedule: "0 4 * * *"
    buildCommand: npm install
    startCommand: node jobs/runVaultReconciler.js --apply

  # -------------------------------------------------------------------
  # Night Shift morning brief — runs jobs/runNightBrief.js.
  # -------------------------------------------------------------------
  # Schedule: 04:30 UTC, after the reconciler so project state from
  # yesterday's AI sessions is settled. Opt-in per user via
  # lykn_user_preferences.night_shift_enabled. Writes morning_brief to
  # lykn_project_state for each active project.
  - type: cron
    name: lykinsai-night-shift-brief
    runtime: node
    plan: starter
    schedule: "30 4 * * *"
    buildCommand: npm install
    startCommand: node jobs/runNightBrief.js
