# =====================================================================
# render.yaml — Render service blueprint
# =====================================================================
# Drives both the always-on web service (server.js) and the nightly
# synthesis cron job. `render.yaml` is read on dashboard sync; without
# it, the cron entry has to be re-added by hand each environment.
#
# Required environment variables (set in the Render dashboard, NOT
# here, since they're secrets):
#   • VITE_SUPABASE_URL
#   • SUPABASE_SERVICE_ROLE_KEY
#   • ANTHROPIC_API_KEY
#   • OPENAI_API_KEY            (for belief + fact embeddings)
#
# After committing this file:
#   1. Connect the repo in Render → "New Blueprint Instance".
#   2. Render reads `services` from this file and creates / updates
#      both the web service and the cron job.
#   3. Set the env vars above on each service.
#   4. The cron will fire at 03:00 UTC daily — manual trigger from the
#      dashboard or via `node jobs/runSynthesis.js --manual` locally.

services:
  # -------------------------------------------------------------------
  # Web service — the existing express server in server.js.
  # -------------------------------------------------------------------
  - type: web
    name: lykinsai-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run server
    autoDeploy: true
    healthCheckPath: /api/health

  # -------------------------------------------------------------------
  # Nightly belief synthesis cron — runs jobs/runSynthesis.js.
  # -------------------------------------------------------------------
  # Schedule: 03:00 UTC daily. Earlier than the typical "user is
  # working hours" so the digest is fresh when they open LYKN in the
  # morning. Runtime budget at current scale (≤ 100 users, ≤ 500
  # facts/user): a few minutes per run; the per-user pipeline is
  # gated by the LLM call so it scales linearly with proposal count
  # rather than fact count.
  - type: cron
    name: lykinsai-synthesis-nightly
    runtime: node
    plan: starter
    schedule: "0 3 * * *"
    buildCommand: npm install
    startCommand: node jobs/runSynthesis.js

  # -------------------------------------------------------------------
  # Nightly concept clustering cron — runs jobs/runConcepts.js.
  # -------------------------------------------------------------------
  # Schedule: 03:30 UTC, half an hour after the belief job so the
  # embedding-similarity pass inside runConcepts sees beliefs the
  # belief job may have just proposed. Same env vars as the web
  # service (OPENAI_API_KEY for embeddings, ANTHROPIC_API_KEY for
  # the namer LLM). Runtime budget at current scale: a few minutes;
  # the LLM calls are tiny (1-3 word output, ~64 tokens max each).
  - type: cron
    name: lykinsai-concepts-nightly
    runtime: node
    plan: starter
    schedule: "30 3 * * *"
    buildCommand: npm install
    startCommand: node jobs/runConcepts.js

  # -------------------------------------------------------------------
  # Vault upload reconciler — runs jobs/runVaultReconciler.js.
  # -------------------------------------------------------------------
  # Backstop for the orphaned-upload race (migrations 111/112). `--apply`
  # backfills storage_path from the content marker, flags rows whose storage
  # object is missing as upload_state='missing', and SAFELY reaps abandoned
  # in-flight uploads via the upload ledger. The DESTRUCTIVE reverse-scan
  # leaked-file sweep stays OFF here — it requires VAULT_RECONCILER_DELETE_ENABLED=1
  # AND an explicit --delete-leaked, neither of which is set, so this run is
  # non-destructive (mark + safe ledger reap only).
  #
  # Schedule: 04:00 UTC, after the synthesis/concept jobs. Runtime budget at
  # current scale: a couple of minutes (one RPC + a table scan).
  - type: cron
    name: lykinsai-vault-reconciler-nightly
    runtime: node
    plan: starter
    schedule: "0 4 * * *"
    buildCommand: npm install
    startCommand: node jobs/runVaultReconciler.js --apply
