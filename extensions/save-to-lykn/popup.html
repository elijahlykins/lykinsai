<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save to LYKN</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      body {
        margin: 0;
        width: 280px;
        padding: 14px 14px 12px;
        background: #ffffff;
        color: #111;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b0b0c; color: #f5f5f5; }
        .url { color: #9aa0a6; }
        button { background: #1a1a1c; color: #f5f5f5; border-color: #2a2a2d; }
        button:hover { background: #232326; }
        button.primary { background: #ffffff; color: #111; border-color: #ffffff; }
        button.primary:hover { background: #e5e7eb; }
        .footer a { color: #9aa0a6; }
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
      }
      .url {
        font-size: 11px;
        color: #6b7280;
        word-break: break-all;
        margin: 0 0 12px;
        max-height: 32px;
        overflow: hidden;
      }
      .row { display: flex; gap: 8px; }
      button {
        flex: 1;
        appearance: none;
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #111;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { background: #f3f4f6; }
      button.primary {
        background: #111;
        color: #fff;
        border-color: #111;
      }
      button.primary:hover { background: #1f2937; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .footer {
        margin-top: 10px;
        font-size: 11px;
        text-align: right;
      }
      .footer a { color: #6b7280; text-decoration: none; }
      .footer a:hover { text-decoration: underline; }
      .status {
        font-size: 12px;
        margin-top: 8px;
        color: #059669;
      }
      .status.error { color: #dc2626; }
    </style>
  </head>
  <body>
    <h1>Save to LYKN</h1>
    <div class="url" id="currentUrl">Loading…</div>
    <div class="row">
      <button class="primary" id="save">Save to Vault</button>
    </div>
    <div class="status" id="status"></div>
    <div class="footer">
      <a href="#" id="openOptions">Settings</a>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
