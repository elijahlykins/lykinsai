<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LYKN</title>
    <style>
      :root {
        /* Subtle tint laid over the native vibrancy blur for legibility. */
        --tint: rgba(16, 18, 24, 0.28);
        --border: rgba(255, 255, 255, 0.12);
        --divider: rgba(255, 255, 255, 0.10);
        --text: #f4f6fb;
        --muted: #aab2c2;
        --blue: #3b78ff;
        --chat-width: 520px;
        --bar-min-h: 48px;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        width: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        color: var(--text);
      }
      /* Two-column shell: an optional source/follow-up panel on the LEFT and the
         chat column on the RIGHT. Both bottom-aligned; the chat hugs the right so
         it never shifts when the side panel opens (window grows leftward). */
      #shell {
        position: relative;
        height: 100%;
        width: 100%;
        display: flex;
        align-items: stretch;
        justify-content: flex-start;
      }
      /* The chat column. Desktop blur comes from native macOS vibrancy; this just
         adds a faint tint + hairline edge to read as a glass card. */
      #wrap {
        width: var(--chat-width);
        flex: none;
        display: flex;
        flex-direction: column;
        background: var(--tint);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }
      /* Right panel: sources / follow-ups. Absolutely positioned so toggling it
         NEVER reflows the chat column. */
      #side {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 300px;
        box-sizing: border-box;
        padding-left: 12px;
        opacity: 0;
        transform: translateX(6px);
        pointer-events: none;
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      #side.show {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      /* Live watch — fill window height; chat bar pinned to bottom, watch panel on side. */
      #shell.live-watch-mode #wrap {
        height: 100%;
        min-height: 100%;
      }
      #shell.live-watch-mode #side {
        width: 360px;
      }
      #shell.live-watch-mode #thread.show {
        flex: 1 1 auto;
        min-height: 0;
        max-height: none;
        overflow-y: auto;
      }
      #shell.live-watch-mode .composer {
        margin-top: auto;
        flex-shrink: 0;
      }
      #shell.live-watch-mode .side-inner {
        min-height: 0;
      }
      .side-inner {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        background: var(--tint);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }
      .side-inner::-webkit-scrollbar { width: 6px; }
      .side-inner::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 999px;
      }

      /* Collapsible chat thread (only present once there's a turn). Each turn's
         answer collapses when the next prompt is sent, so the glass grows to fit
         the CURRENT response instead of accumulating forever. */
      #thread {
        display: none;
        max-height: 420px;
        overflow-y: auto;
        overflow-x: hidden;
        border-bottom: 1px solid var(--divider);
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }
      #thread.show { display: block; }
      #thread::-webkit-scrollbar { width: 6px; }
      #thread::-webkit-scrollbar-track { background: transparent; }
      #thread::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 999px;
      }
      #thread::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

      .chat { border-top: 1px solid rgba(255, 255, 255, 0.05); }
      .chat:first-child { border-top: none; }
      /* The user's prompt doubles as a clickable collapse/expand header. */
      .chat-q {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: transparent;
        border: none;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      .chat-q:hover { background: rgba(255, 255, 255, 0.04); }
      .chat-q .chev {
        width: 14px; height: 14px;
        flex: none;
        color: var(--muted);
        transition: transform 0.18s ease;
      }
      .chat.collapsed .chev { transform: rotate(-90deg); }
      .chat-q .q-text {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chat-a {
        padding: 0 16px 14px 38px;
        font-size: 14px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
        color: #e9edf6;
        -webkit-user-select: text;
        user-select: text;
      }
      .chat.collapsed .chat-a { display: none; }
      .chat.collapsed .suggest { display: none; }

      /* Left panel sections. */
      .side-sec { margin-bottom: 14px; }
      .side-sec:last-child { margin-bottom: 0; }
      .side-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .side-list { display: flex; flex-direction: column; gap: 6px; }

      /* Cluely-style suggestions: source links + follow-up questions. */
      .suggest { padding: 2px 16px 14px 38px; }
      .suggest-sec { margin-top: 10px; }
      .suggest-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .suggest-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .suggest-col { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }

      /* Source cards: squircle favicon tile + title/domain, stacked on the left
         so they're easy to scan. */
      .suggest-link {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font: inherit;
        border-radius: 12px;
        padding: 8px 11px;
        cursor: pointer;
        text-align: left;
        transition: background 0.14s ease, border-color 0.14s ease, transform 0.1s ease;
      }
      .suggest-link:hover {
        background: rgba(96, 165, 250, 0.12);
        border-color: rgba(96, 165, 250, 0.38);
      }
      .suggest-link:active { transform: translateY(1px); }
      .suggest-fav {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 8px; /* square with rounded edges */
        overflow: hidden;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .suggest-fav-img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .suggest-fav.fallback { color: #60a5fa; }
      .suggest-fav.fallback svg { width: 16px; height: 16px; }
      .suggest-link-col {
        display: flex;
        flex-direction: column;
        min-width: 0;
        gap: 1px;
      }
      .suggest-link-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .suggest-link-domain {
        font-size: 11.5px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Follow-up chips. */
      .suggest-chip {
        -webkit-app-region: no-drag;
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 7px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        border-radius: 9px;
        padding: 8px 11px;
        cursor: pointer;
        text-align: left;
        transition: background 0.14s ease, border-color 0.14s ease;
      }
      .suggest-chip:hover {
        background: rgba(96, 165, 250, 0.14);
        border-color: rgba(96, 165, 250, 0.4);
      }
      .suggest-chip-ico { display: inline-flex; flex: none; color: var(--muted); }
      .suggest-chip-ico svg { width: 13px; height: 13px; }
      .suggest-chip:hover .suggest-chip-ico { color: #60a5fa; }
      /* Rendered Markdown answers: drop pre-wrap so block elements control
         spacing instead of literal newlines doubling it up. */
      .chat-a.has-md { white-space: normal; }
      .chat-a.has-md > :first-child { margin-top: 0; }
      .chat-a.has-md > :last-child { margin-bottom: 0; }
      .chat-a .md-h {
        font-size: 14px;
        font-weight: 700;
        color: #f4f6fb;
        margin: 12px 0 5px;
      }
      .chat-a p { margin: 0 0 8px; }
      .chat-a ul, .chat-a ol { margin: 5px 0 9px; padding-left: 20px; }
      .chat-a li { margin: 3px 0; }
      .chat-a strong { font-weight: 700; color: #f4f6fb; }
      .chat-a em { font-style: italic; }
      .chat-a a { color: #60a5fa; text-decoration: underline; }
      .chat-a code {
        background: rgba(255, 255, 255, 0.09);
        padding: 1px 5px;
        border-radius: 5px;
        font-size: 12.5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* Loading state: the LYKN icon outline drawing on a loop + a shimmer
         status label — identical to the chat page's ThinkingIndicator. */
      .thinking {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 2px 0 4px;
      }
      .lykn-outline-spinner {
        color: #f4f6fb;
        transform-box: fill-box;
        transform-origin: center;
        animation: lyknOutlinePop 3.6s ease-in-out infinite;
        flex: none;
      }
      .lykn-outline-spinner path {
        stroke-dasharray: 1;
        animation: lyknOutlineDraw 3.6s ease-in-out infinite;
      }
      @keyframes lyknOutlineDraw {
        0%   { stroke-dashoffset: 1; stroke-opacity: 1; fill-opacity: 0; }
        40%  { stroke-dashoffset: 0; stroke-opacity: 1; fill-opacity: 0; }
        55%  { stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 1; }
        82%  { stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 1; }
        96%  { stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 0; }
        100% { stroke-dashoffset: 1; stroke-opacity: 0; fill-opacity: 0; }
      }
      @keyframes lyknOutlinePop {
        0%   { transform: scale(0.9); }
        40%  { transform: scale(1); }
        82%  { transform: scale(1); }
        100% { transform: scale(0.9); }
      }
      .thinking-text {
        display: inline-block;
        font-size: 13px;
        font-weight: 500;
        background: linear-gradient(
          100deg,
          rgba(255, 255, 255, 0.40) 0%,
          rgba(255, 255, 255, 0.40) 42%,
          rgba(255, 255, 255, 0.90) 50%,
          rgba(255, 255, 255, 0.40) 58%,
          rgba(255, 255, 255, 0.40) 100%
        );
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: lyknThinkingShimmer 2.4s linear infinite;
        will-change: background-position;
      }
      @keyframes lyknThinkingShimmer {
        0%   { background-position: 130% 0; }
        100% { background-position: -130% 0; }
      }

      /* Drag handle — a little window-style tab in the top-left used to move the
         whole panel around. Keeps dragging off the input row so it never fights
         with typing or the live resize. */
      .titlebar {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        height: 20px;
        padding: 0 12px;
        cursor: grab;
      }
      .titlebar.dragging { cursor: grabbing; }
      .titlebar .grip {
        width: 34px;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        transition: background 0.15s ease;
      }
      .titlebar:hover .grip { background: rgba(255, 255, 255, 0.32); }

      /* Composer — textarea row + bottom toolbar (matches main app layout). */
      .composer {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px 12px 8px;
        flex: none;
      }
      .composer-field-row {
        display: flex;
        align-items: flex-start;
        gap: 6px;
      }
      /* Side-panel view picker — toolbar trigger + inline drawer (like More). */
      .side-picker-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 30px;
        max-width: 9rem;
        min-width: 0;
        flex: none;
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.75);
        background: transparent;
        border: none;
        border-radius: 10px;
        padding: 0 8px 0 10px;
        cursor: pointer;
        transition: color 0.15s ease, background 0.15s ease;
        -webkit-app-region: no-drag;
      }
      .side-picker-btn:hover,
      .side-picker-btn.active {
        color: #f4f6fb;
        background: rgba(96, 165, 250, 0.14);
      }
      #side-picker-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
      }
      .panel-drawer {
        display: none;
        flex-direction: column;
        overflow-x: hidden;
        overflow-y: auto;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        margin-top: 4px;
        padding-top: 4px;
        max-height: 220px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }
      .panel-drawer::-webkit-scrollbar { width: 6px; }
      .panel-drawer::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 999px;
      }
      .composer.panel-open .panel-drawer { display: flex; }
      .panel-menu { display: flex; flex-direction: column; gap: 2px; }
      .panel-menu-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        text-align: left;
        padding: 9px 10px;
        border-radius: 10px;
        background: transparent;
        border: none;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .panel-menu-item:hover { background: rgba(255, 255, 255, 0.1); }
      .panel-menu-item.active { background: rgba(96, 165, 250, 0.12); color: #93c5fd; }
      .panel-menu-item.empty { color: rgba(255, 255, 255, 0.42); }
      .panel-menu-item .count {
        font-size: 11px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.38);
        flex: none;
      }
      .side-empty {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        padding: 20px 10px;
      }
      .side-text-item {
        font-size: 12px;
        line-height: 1.45;
        color: var(--text);
        padding: 8px 10px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .side-summary {
        font-size: 12px;
        line-height: 1.5;
        color: var(--text);
        padding: 8px 10px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        white-space: pre-wrap;
      }
      .bar-toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-top: 0;
        -webkit-app-region: no-drag;
      }
      .toolbar-spacer { flex: 1; min-width: 4px; }
      .bar-btn {
        -webkit-app-region: no-drag;
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.72);
        background: transparent;
        border: 1px solid transparent;
        padding: 0;
        transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }
      .bar-btn:hover:not(:disabled) {
        color: #f4f6fb;
        background: rgba(255, 255, 255, 0.06);
      }
      .bar-btn svg { width: 14px; height: 14px; }
      .bar-btn.more-btn.active { color: #60a5fa; background: rgba(96, 165, 250, 0.14); }

      /* Inline hamburger drawer — expands inside the composer, never leaves the bar. */
      .more-drawer {
        display: none;
        flex-direction: column;
        overflow-x: hidden;
        overflow-y: auto;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        margin-top: 4px;
        padding-top: 4px;
        max-height: 220px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }
      .more-drawer::-webkit-scrollbar { width: 6px; }
      .more-drawer::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 999px;
      }
      .composer.more-open .more-drawer { display: flex; }

      /* More-menu items inside the inline drawer. */
      .menu {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: none;
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 10px;
        background: transparent;
        border: none;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .menu-item:hover { background: rgba(255, 255, 255, 0.1); }
      .menu-item svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
      /* Right-aligned on/off badge for toggle menu items. */
      .menu-state {
        margin-left: auto;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.18);
        color: #60a5fa;
      }
      .menu-item[aria-pressed="false"] .menu-state {
        background: rgba(255, 255, 255, 0.1);
        color: var(--muted);
      }
      .menu-item[aria-pressed="true"] .menu-state {
        background: rgba(52, 211, 153, 0.18);
        color: #34d399;
      }

      .watch-connected-banner {
        font-size: 11px;
        font-weight: 600;
        line-height: 1.4;
        color: #60a5fa;
        padding: 8px 10px;
        margin-bottom: 10px;
        border-radius: 8px;
        background: rgba(37, 99, 235, 0.12);
        border: 1px solid rgba(37, 99, 235, 0.22);
        text-align: center;
      }
      .watch-side-rules {
        font-size: 11px;
        line-height: 1.45;
        color: var(--muted);
        padding: 6px 8px;
        margin-bottom: 8px;
        border-radius: 8px;
        background: rgba(52, 211, 153, 0.08);
      }
      .watch-install-btn {
        display: block;
        width: 100%;
        margin: 0 0 10px;
        padding: 8px 10px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        background: #2563eb;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .watch-install-btn:hover { background: #1d4ed8; }
      .watch-side-item {
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .watch-side-item.system { opacity: 0.75; }
      .watch-side-item.alert {
        background: rgba(251, 191, 36, 0.1);
        border-color: rgba(251, 191, 36, 0.28);
      }
      .watch-side-meta {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #34d399;
        margin-bottom: 4px;
      }
      .watch-side-item.alert .watch-side-meta { color: #fbbf24; }
      .watch-side-item.system .watch-side-meta { color: var(--muted); }
      .watch-side-text {
        font-size: 13px;
        line-height: 1.45;
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* Active states for the voice / live-notes items moved into this menu. */
      .menu-item.voice-active { color: #60a5fa; background: rgba(96, 165, 250, 0.12); }
      .menu-item.voice-active svg { color: #60a5fa; }
      .menu-item.listening { color: #f87171; background: rgba(248, 113, 113, 0.12); }
      .menu-item.listening svg { color: #f87171; }
      .menu-sep { height: 1px; margin: 4px 6px; background: rgba(255, 255, 255, 0.1); }

      /* Browser control confirmation — shown after planning, before execution. */
      .browser-act {
        display: none;
        flex-direction: column;
        gap: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        margin-top: 4px;
        padding-top: 8px;
      }
      .composer.browser-act-open .browser-act { display: flex; }
      .browser-act-head {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
      }
      .browser-act-steps {
        margin: 0;
        padding: 0 0 0 18px;
        font-size: 12px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.82);
      }
      .browser-act-steps li { margin: 2px 0; }
      .browser-act-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .browser-act-actions button {
        -webkit-app-region: no-drag;
        border: none;
        border-radius: 8px;
        padding: 6px 12px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      #browser-act-cancel {
        color: rgba(255, 255, 255, 0.72);
        background: rgba(255, 255, 255, 0.06);
      }
      #browser-act-run {
        color: #0b0b0f;
        background: #60a5fa;
      }
      #browser-act-run:disabled { opacity: 0.5; cursor: default; }

      /* Past chats sub-view inside the inline drawer. */
      .history-panel {
        display: none;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .history-panel.show { display: flex; }
      .history-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .history-head-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }
      .history-head .spacer { flex: 1; }
      .history-icon-btn {
        -webkit-app-region: no-drag;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: rgba(255, 255, 255, 0.55);
        cursor: pointer;
        transition: background 0.12s ease, color 0.12s ease;
      }
      .history-icon-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }
      .history-icon-btn svg { width: 14px; height: 14px; }
      .history-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 4px 2px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }
      .history-list::-webkit-scrollbar { width: 6px; }
      .history-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 999px;
      }
      .history-group {
        padding: 6px 10px 2px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }
      .history-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        padding: 4px 10px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        transition: background 0.12s ease;
      }
      .history-item:hover { background: rgba(255, 255, 255, 0.06); }
      .history-item.active { background: rgba(255, 255, 255, 0.08); }
      .history-item .hi-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex: none;
        background: rgba(255, 255, 255, 0.28);
      }
      .history-item.active .hi-dot { background: rgba(255, 255, 255, 0.75); }
      .history-item .hi-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 400;
      }
      .history-empty {
        padding: 14px 12px;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
      .history-signin {
        padding: 10px 12px 14px;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
      .history-signin button {
        margin-top: 6px;
        font: inherit;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        background: transparent;
        border: none;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .history-signin button:hover { color: var(--text); }

      /* Drag-and-drop highlight when files hover over the panel. */
      #wrap.dropping { box-shadow: inset 0 0 0 2px rgba(96, 165, 250, 0.65); }
      .drop-hint {
        display: none;
        padding: 6px 16px 0;
        font-size: 12px;
        color: #93c5fd;
      }
      #wrap.dropping .drop-hint { display: block; }

      /* Attachment chips for dropped files. */
      .attachments {
        display: none;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 12px 0;
      }
      .attachments.show { display: flex; }
      .chip {
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 220px;
        padding: 4px 6px 4px 4px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 12px;
        color: var(--text);
      }
      .chip img {
        width: 26px; height: 26px;
        border-radius: 6px;
        object-fit: cover;
        flex: none;
      }
      .chip .chip-ico {
        width: 24px; height: 24px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.08);
        color: var(--muted);
        flex: none;
      }
      .chip .chip-ico svg { width: 14px; height: 14px; }
      .chip .chip-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip .chip-x {
        flex: none;
        cursor: pointer;
        color: var(--muted);
        width: 16px; height: 16px;
        display: grid;
        place-items: center;
        border-radius: 4px;
      }
      .chip .chip-x:hover { color: #fff; background: rgba(255, 255, 255, 0.14); }
      .chip .chip-x svg { width: 12px; height: 12px; }

      /* LYKN mark — top of the field row, aligned with the first line of text. */
      .dot {
        width: 20px; height: 20px;
        flex: none;
        margin-top: 5px;
        color: var(--blue);
        cursor: pointer;
        -webkit-app-region: no-drag;
        filter: drop-shadow(0 0 3px rgba(59, 120, 255, 0.85))
          drop-shadow(0 0 6px rgba(59, 120, 255, 0.5));
        transition: transform 0.2s ease, opacity 0.2s ease;
      }
      .dot:hover { transform: scale(1.12); }

      /* Collapsed state: the whole panel becomes a single LYKN icon bubble. */
      #bubble {
        display: none;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: var(--tint);
        border: 1px solid var(--border);
        border-radius: 16px;
        color: var(--blue);
        cursor: pointer;
        filter: drop-shadow(0 0 3px rgba(59, 120, 255, 0.8))
          drop-shadow(0 0 6px rgba(59, 120, 255, 0.45));
        transition: transform 0.15s ease, background 0.15s ease;
      }
      #bubble:hover { transform: scale(1.06); background: rgba(40, 44, 54, 0.42); }
      #bubble:active { transform: scale(0.96); }
      #bubble svg { width: 28px; height: 28px; }
      #bubble svg path { fill: none; stroke: currentColor; }
      body.collapsed #shell { display: none; }
      body.collapsed #bubble { display: flex; }
      .dot path {
        fill: none;
        stroke: currentColor;
      }
      .dot.busy { animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.5; transform:scale(.86)} }

      /* The prompt field is a textarea so it grows downward as the user types,
         like the main app's chat bar (Enter sends, Shift+Enter = newline). */
      #ask {
        -webkit-app-region: no-drag;
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 12px;
        font-family: inherit;
        line-height: 16px;
        padding: 6px 2px 2px;
        resize: none;
        height: var(--bar-min-h);
        min-height: var(--bar-min-h);
        max-height: 180px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }
      #ask::placeholder { color: var(--muted); }
      #ask::-webkit-scrollbar { width: 6px; }
      #ask::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 999px;
      }

      .hint {
        -webkit-app-region: no-drag;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      kbd {
        font-family: inherit;
        background: rgba(255,255,255,0.1);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 11px;
      }
      /* Plain icon mic in the bottom toolbar. */
      .mic:disabled { opacity: 0.45; cursor: not-allowed; }
      .mic .ico-mic-spin { display: none; animation: spin 0.8s linear infinite; }
      .mic.recording {
        color: #60a5fa;
        border-color: rgba(96, 165, 250, 0.4);
        background: rgba(96, 165, 250, 0.1);
        animation: micPulse 1.4s ease-in-out infinite;
      }
      .mic.transcribing .ico-mic { display: none; }
      .mic.transcribing .ico-mic-spin { display: block; }
      .mic.voice-active {
        color: #60a5fa;
        border-color: rgba(96, 165, 250, 0.4);
        background: rgba(96, 165, 250, 0.1);
        animation: micPulse 1.4s ease-in-out infinite;
      }
      @keyframes micPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.0); }
        50% { box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.18); }
      }

      /* Compact glass send — bottom toolbar, aligned with mic/more. */
      .send {
        color: #60a5fa;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(8px) saturate(140%);
        -webkit-backdrop-filter: blur(8px) saturate(140%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transition:
          box-shadow 0.18s ease,
          transform 0.15s ease,
          background 0.18s ease,
          border-color 0.18s ease;
      }
      .send:hover:not(:disabled) {
        background: rgba(96, 165, 250, 0.16);
        border-color: rgba(96, 165, 250, 0.4);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 0 16px rgba(59, 130, 246, 0.18);
      }
      .send:active:not(:disabled) {
        transform: translateY(1px);
        background: rgba(96, 165, 250, 0.22);
        box-shadow:
          inset 0 0 0 1px rgba(96, 165, 250, 0.25),
          0 0 10px rgba(59, 130, 246, 0.14);
      }
      .send:disabled:not(.busy) { opacity: 0.4; cursor: not-allowed; }
      .send .ico-spin { display: none; animation: spin 0.8s linear infinite; }
      .send.busy .ico-send { display: none; }
      .send.busy .ico-spin { display: block; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Live-listen (meeting notes) panel. */
      #live { display: none; flex-direction: column; padding: 6px 14px 2px; }
      #live.show { display: flex; }
      .live-head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .live-dot {
        flex: none;
        width: 7px; height: 7px; border-radius: 50%;
        background: #6b7280;
      }
      .live-dot.live {
        background: #ef4444;
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.7);
        animation: livePulse 1.4s ease-in-out infinite;
      }
      .live-title { flex: none; }
      @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      .live-tabs {
        display: flex;
        gap: 4px;
        margin-left: auto;
      }
      .live-tab {
        -webkit-app-region: no-drag;
        border: none;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 7px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .live-tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
      .live-tab.active { color: var(--text); background: rgba(255, 255, 255, 0.1); }
      .live-close {
        -webkit-app-region: no-drag;
        flex: none;
        display: grid;
        place-items: center;
        width: 20px; height: 20px;
        border: none;
        background: transparent;
        color: var(--muted);
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .live-close:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); }
      .live-close svg { width: 14px; height: 14px; }
      .live-pane { max-height: 260px; overflow-y: auto; }
      .notes-summary {
        font-size: 13px;
        line-height: 1.5;
        color: var(--text);
      }
      .notes-summary:empty::after {
        content: "Listening… notes will appear as the conversation builds.";
        color: var(--muted);
        font-style: italic;
      }
      .notes-section { margin-top: 10px; }
      .notes-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .notes-list { list-style: none; margin: 0; padding: 0; }
      .notes-list li {
        position: relative;
        padding-left: 16px;
        font-size: 13px;
        line-height: 1.45;
        color: var(--text);
        margin-bottom: 4px;
      }
      .notes-list li::before {
        content: "";
        position: absolute;
        left: 3px; top: 8px;
        width: 4px; height: 4px;
        border-radius: 50%;
        background: var(--muted);
      }
      .notes-list.actions li::before {
        content: "";
        left: 2px; top: 4px;
        width: 9px; height: 9px;
        border-radius: 3px;
        background: transparent;
        border: 1.5px solid #60a5fa;
      }
      .live-body {
        max-height: 240px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.5;
        color: var(--text);
        word-break: break-word;
      }
      .live-body:empty::after {
        content: "Capturing audio… speech will appear here.";
        color: var(--muted);
        font-style: italic;
      }
      .live-line { margin-bottom: 7px; }
      .live-line:last-child { margin-bottom: 0; }
      .live-speaker {
        display: inline-block;
        margin-right: 7px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        vertical-align: 1px;
      }
      .live-line.you .live-speaker { color: #60a5fa; }   /* the user */
      .live-line.them .live-speaker { color: #34d399; }  /* video / other person */
      .live-text { color: var(--text); }
      /* Listen button active state (reuses .mic). */
      .mic.listening { color: #f87171; }
      .mic.listening svg { animation: micPulse 1.4s ease-in-out infinite; }
    </style>
  </head>
