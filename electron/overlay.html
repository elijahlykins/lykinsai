<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LYKN</title>
    <style>
      :root {
        /* Subtle tint laid over the native vibrancy blur for legibility. */
        --tint: rgba(16, 18, 24, 0.28);
        --border: rgba(255, 255, 255, 0.12);
        --divider: rgba(255, 255, 255, 0.10);
        --text: #f4f6fb;
        --muted: #aab2c2;
        --blue: #3b78ff;
        --chat-width: 520px;
        --bar-min-h: 48px;
      }
      /* Windows/Linux: no NSVisualEffectView — denser tint + CSS blur.
         HWND stays fully transparent; clip-path keeps backdrop-filter inside
         the 16px radius (Chromium on Win often fails to clip blur otherwise). */
      html.no-vibrancy {
        --tint: rgba(16, 18, 24, 0.82);
        --border: rgba(255, 255, 255, 0.16);
      }
      html.no-vibrancy,
      html.no-vibrancy body,
      html.no-vibrancy #shell {
        background: transparent !important;
      }
      html.no-vibrancy #wrap,
      html.no-vibrancy #bubble {
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        clip-path: inset(0 round 16px);
      }
      * { box-sizing: border-box; }
      /* No scrollbar is ever drawn in LYKN: panes still scroll by wheel,
         trackpad, keyboard and drag, only the gutter is gone. This window has
         its own document, so it can't inherit the app-wide rule in index.css. */
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      *::-webkit-scrollbar {
        width: 0 !important;
        height: 0 !important;
        display: none !important;
      }
      html, body {
        margin: 0;
        height: 100%;
        width: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        -webkit-user-select: none;
        user-select: none;
      }
      /* Chat replies, code, and the composer are freely highlightable —
         chrome (titlebar, toolbars, buttons) stays non-selectable above. */
      #ask,
      .chat-a,
      .chat-a-body,
      .chat-a-body *,
      .chat-q,
      .chat-q .q-text {
        -webkit-user-select: text;
        user-select: text;
      }
      .titlebar,
      .titlebar *,
      .chat-a-actions,
      .chat-a-actions *,
      .chat-q .chev,
      button {
        -webkit-user-select: none;
        user-select: none;
      }
      /* Two-column shell: an optional source/follow-up panel on the LEFT and the
         chat column on the RIGHT. Both bottom-aligned; the chat hugs the right so
         it never shifts when the side panel opens (window grows leftward). */
      #shell {
        position: relative;
        height: 100%;
        width: 100%;
        display: flex;
        align-items: stretch;
        justify-content: flex-start;
      }
      /* The chat column. Desktop blur comes from native macOS vibrancy; this just
         adds a faint tint + hairline edge to read as a glass card. */
      #wrap {
        width: var(--chat-width);
        flex: none;
        display: flex;
        flex-direction: column;
        background: var(--tint);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }
      /* Side panel (sources / tasks / notes / live feedback) — this DOM stays
         HIDDEN and serves as the state store; the visible card is a detached
         floating vibrancy window (panel.html) that mirrors this markup via
         pushed snapshots, exactly like the live notes card. */
      #side { display: none; }

      /* Collapsible chat thread (only present once there's a turn). Each turn's
         answer collapses when the next prompt is sent, so the glass grows to fit
         the CURRENT response instead of accumulating forever. */
      #thread {
        display: none;
        max-height: 420px;
        overflow-y: auto;
        overflow-x: hidden;
        border-bottom: 1px solid var(--divider);
      }
      #thread.show { display: block; }

      .chat { border-top: 1px solid rgba(255, 255, 255, 0.05); }
      .chat:first-child { border-top: none; }
      /* The user's prompt doubles as a clickable collapse/expand header. */
      .chat-q {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: transparent;
        border: none;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
        -webkit-user-select: text;
        user-select: text;
      }
      .chat-q:hover { background: rgba(255, 255, 255, 0.04); }
      .chat-q .chev {
        width: 14px; height: 14px;
        flex: none;
        color: var(--muted);
        transition: transform 0.18s ease;
      }
      .chat.collapsed .chev { transform: rotate(-90deg); }
      .chat-q .q-text {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        -webkit-user-select: text;
        user-select: text;
      }
      .chat-a {
        padding: 0 16px 14px 38px;
        font-size: 14px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
        color: #e9edf6;
        cursor: text;
        -webkit-user-select: text;
        user-select: text;
      }
      .chat-a-body { min-width: 0; }
      .chat-a-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 10px;
        padding-top: 2px;
      }
      .chat-a-actions[hidden] { display: none !important; }
      /* Parked-on-you indicator: stays on screen after the turn ends so it is
         obvious the run is paused and still watching, not finished. Carries the
         same drawing LYKN mark as the thinking state — a pause is the agent
         alive and holding the task, not an alert to acknowledge. */
      .agent-waiting-row {
        margin-top: 8px;
        -webkit-app-region: no-drag;
      }
      .agent-waiting-row[hidden] { display: none !important; }
      .agent-waiting-detail {
        /* Aligns under the label: 24px mark + the 12px .thinking gap. */
        margin: 2px 0 0 36px;
        font-size: 12.5px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.62);
      }
      .agent-choice-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
        -webkit-app-region: no-drag;
      }
      .agent-choice-row[hidden] { display: none !important; }
      .agent-choice-btn {
        -webkit-app-region: no-drag;
        border: none;
        border-radius: 8px;
        padding: 8px 12px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.12s ease, opacity 0.12s ease;
      }
      .agent-choice-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .agent-choice-btn.primary {
        color: #0b0b0f;
        background: #60a5fa;
      }
      .agent-choice-btn.primary:hover:not(:disabled) {
        background: #93c5fd;
      }
      .agent-choice-btn.secondary {
        color: rgba(255, 255, 255, 0.82);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .agent-choice-btn.secondary:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.14);
      }
      .chat-copy {
        -webkit-app-region: no-drag;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.72);
        cursor: pointer;
        transition: color 0.12s ease, background 0.12s ease, border-color 0.12s ease;
      }
      .chat-copy:hover {
        color: #f4f6fb;
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.16);
      }
      .chat-copy.copied {
        color: #fff;
        border-color: #1d4ed8;
        background: #2563eb;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.22);
      }
      .chat-copy svg { width: 14px; height: 14px; flex: none; }
      .chat.collapsed .chat-a { display: none; }
      .chat.collapsed .suggest { display: none; }

      /* Clean-bar mode: previous turns are hidden ENTIRELY (not just folded to
         headers), so only the newest prompt + answer shows. The turns stay in
         the DOM and the history array is untouched — the AI keeps the full
         conversation context; this is purely visual. */
      #thread.clean .chat:not(:last-child) { display: none; }

      /* Left panel sections. */
      .side-sec { margin-bottom: 14px; }
      .side-sec:last-child { margin-bottom: 0; }
      .side-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .side-list { display: flex; flex-direction: column; gap: 6px; }

      /* Cluely-style suggestions: source links + follow-up questions. */
      .suggest { padding: 2px 16px 14px 38px; }
      .suggest-sec { margin-top: 10px; }
      .suggest-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .suggest-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .suggest-col { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }

      /* Source cards: squircle favicon tile + title/domain, stacked on the left
         so they're easy to scan. */
      .suggest-link {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font: inherit;
        border-radius: 12px;
        padding: 8px 11px;
        cursor: pointer;
        text-align: left;
        transition: background 0.14s ease, border-color 0.14s ease, transform 0.1s ease;
      }
      .suggest-link:hover {
        background: rgba(96, 165, 250, 0.12);
        border-color: rgba(96, 165, 250, 0.38);
      }
      .suggest-link:active { transform: translateY(1px); }
      .suggest-fav {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 8px; /* square with rounded edges */
        overflow: hidden;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .suggest-fav-img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .suggest-fav.fallback { color: #60a5fa; }
      .suggest-fav.fallback svg { width: 16px; height: 16px; }
      .suggest-link-col {
        display: flex;
        flex-direction: column;
        min-width: 0;
        gap: 1px;
      }
      .suggest-link-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .suggest-link-domain {
        font-size: 11.5px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Follow-up chips. */
      .suggest-chip {
        -webkit-app-region: no-drag;
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 7px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        border-radius: 9px;
        padding: 8px 11px;
        cursor: pointer;
        text-align: left;
        transition: background 0.14s ease, border-color 0.14s ease;
      }
      .suggest-chip:hover {
        background: rgba(96, 165, 250, 0.14);
        border-color: rgba(96, 165, 250, 0.4);
      }
      .suggest-chip-ico { display: inline-flex; flex: none; color: var(--muted); }
      .suggest-chip-ico svg { width: 13px; height: 13px; }
      .suggest-chip:hover .suggest-chip-ico { color: #60a5fa; }
      /* Rendered Markdown answers: drop pre-wrap so block elements control
         spacing instead of literal newlines doubling it up. */
      .chat-a.has-md { white-space: normal; }
      .chat-a.has-md > :first-child { margin-top: 0; }
      .chat-a.has-md > :last-child { margin-bottom: 0; }
      .chat-a .md-h {
        font-size: 14px;
        font-weight: 700;
        color: #f4f6fb;
        margin: 12px 0 5px;
      }
      .chat-a p { margin: 0 0 8px; }
      .chat-a ul, .chat-a ol { margin: 5px 0 9px; padding-left: 20px; }
      .chat-a li { margin: 3px 0; }
      .chat-a strong { font-weight: 700; color: #f4f6fb; }
      .chat-a em { font-style: italic; }
      .chat-a a { color: #60a5fa; text-decoration: underline; }
      .chat-a code {
        background: rgba(255, 255, 255, 0.09);
        padding: 1px 5px;
        border-radius: 5px;
        font-size: 12.5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      /* Generated images (standalone ![alt](url) lines from image mode). */
      .chat-a .md-img {
        margin: 8px 0;
        position: relative;
        display: inline-block;
        max-width: 100%;
      }
      .chat-a .md-img img {
        display: block;
        max-width: 100%;
        max-height: 320px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        cursor: pointer;
      }
      /* Coded artifacts (Build mode): live iframe preview card. */
      .chat-a .md-artifact {
        margin: 8px 0;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.04);
      }
      .chat-a .md-artifact-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.85);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .chat-a .md-artifact-head span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chat-a .md-artifact-actions {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .chat-a .md-artifact-head a {
        flex: none;
        font-weight: 500;
        text-decoration: none;
      }
      /* Download / Code / Edit buttons on generated images / built artifacts. */
      .chat-a .md-dl,
      .chat-a .md-code,
      .chat-a .md-code-copy,
      .chat-a .md-edit-build,
      .chat-a .md-edit-image {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.85);
        font: inherit;
        font-size: 11.5px;
        font-weight: 500;
        line-height: 1;
        padding: 4px 9px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      .chat-a .md-dl:hover:not(:disabled),
      .chat-a .md-code:hover:not(:disabled),
      .chat-a .md-code-copy:hover:not(:disabled),
      .chat-a .md-edit-build:hover:not(:disabled),
      .chat-a .md-edit-image:hover:not(:disabled) { background: rgba(255, 255, 255, 0.16); }
      .chat-a .md-dl:disabled,
      .chat-a .md-code:disabled,
      .chat-a .md-code-copy:disabled,
      .chat-a .md-edit-build:disabled,
      .chat-a .md-edit-image:disabled { opacity: 0.7; cursor: default; }
      .chat-a .md-edit-build,
      .chat-a .md-edit-image {
        border-color: rgba(59, 120, 255, 0.45);
        background: rgba(59, 120, 255, 0.18);
        color: rgba(220, 230, 255, 0.95);
      }
      .chat-a .md-edit-build:hover:not(:disabled),
      .chat-a .md-edit-image:hover:not(:disabled) {
        background: rgba(59, 120, 255, 0.3);
      }
      .chat-a .md-code-copy.copied {
        color: #4ade80;
        border-color: rgba(74, 222, 128, 0.45);
        background: rgba(74, 222, 128, 0.14);
      }
      .chat-a .md-code-copy.copied:hover:not(:disabled) {
        background: rgba(74, 222, 128, 0.18);
        color: #4ade80;
      }
      /* Code view: the raw JSX the AI wrote, swapped in for the live preview. */
      .chat-a .md-artifact-code-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 12px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.55);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .chat-a .md-artifact-code pre {
        margin: 0;
        padding: 10px 12px;
        max-height: 320px;
        overflow: auto;
        font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: rgba(255, 255, 255, 0.82);
        white-space: pre;
        -webkit-user-select: text;
        user-select: text;
      }
      /* Image Edit / Download: hover-reveal pills in the image's top-right. */
      .chat-a .md-img-actions {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 6px;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      .chat-a .md-img:hover .md-img-actions { opacity: 1; }
      .chat-a .md-img-actions .md-dl,
      .chat-a .md-img-actions .md-edit-image {
        background: rgba(17, 17, 20, 0.72);
      }
      .chat-a .md-img-actions .md-dl:hover:not(:disabled),
      .chat-a .md-img-actions .md-edit-image:hover:not(:disabled) {
        background: rgba(17, 17, 20, 0.9);
      }
      .chat-a .md-artifact iframe {
        display: block;
        width: 100%;
        height: 320px;
        border: 0;
        background: #fff;
      }
      /* Rendered videos (lykn_render_video): inline playable mp4 card. */
      .chat-a .md-video video {
        display: block;
        width: 100%;
        max-height: 320px;
        background: #000;
      }
      /* Vault / neuron pull-up card (lykn_loadNeuron → Open in app). */
      .chat-a .md-step {
        display: block;
        width: 100%;
        margin: 4px 0;
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        color: inherit;
        overflow: hidden;
      }
      .chat-a .md-step + .md-step {
        margin-top: 4px;
      }
      .chat-a .md-step[open] {
        background: rgba(255, 255, 255, 0.06);
      }
      .chat-a .md-step-pending {
        opacity: 0.42;
        pointer-events: none;
      }
      .chat-a .md-step-summary {
        display: flex;
        align-items: center;
        gap: 8px;
        list-style: none;
        min-height: 30px;
        padding: 6px 10px;
        cursor: pointer;
        user-select: none;
      }
      .chat-a .md-step-summary::-webkit-details-marker { display: none; }
      .chat-a .md-step-summary::marker { content: ""; }
      .chat-a .md-step-done > .md-step-summary:hover,
      .chat-a .md-step[data-expandable="1"] > .md-step-summary:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .chat-a .md-step-summary {
        cursor: pointer;
      }
      .chat-a .md-step-caret {
        flex: none;
        margin-left: 2px;
        font-size: 13px;
        line-height: 1;
        color: rgba(255, 255, 255, 0.32);
        transition: transform 120ms ease, color 120ms ease;
      }
      .chat-a .md-step[open] > .md-step-summary .md-step-caret {
        transform: rotate(90deg);
        color: rgba(255, 255, 255, 0.5);
      }
      .chat-a .md-step-open {
        margin: 10px 0 0;
        padding: 3px 9px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.05);
        color: rgba(226, 232, 240, 0.85);
        font: inherit;
        font-size: 11.5px;
        cursor: pointer;
      }
      .chat-a .md-step-open:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .chat-a .md-step-check {
        flex: none;
        display: inline-grid;
        place-items: center;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(52, 211, 153, 0.18);
        box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.45);
        color: rgba(167, 243, 208, 0.95);
      }
      .chat-a .md-step-check svg {
        display: block;
        width: 9px;
        height: 9px;
      }
      .chat-a .md-step-dot {
        flex: none;
        width: 8px;
        height: 8px;
        margin: 0 3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.28);
      }
      .chat-a .md-step-spin {
        flex: none;
        width: 14px;
        height: 14px;
        color: rgba(191, 219, 254, 0.95);
      }
      .chat-a .md-step-title {
        flex: 1;
        min-width: 0;
        font-size: 12.5px;
        font-weight: 550;
        color: rgba(255, 255, 255, 0.9);
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chat-a .md-step-live .md-step-title {
        color: rgba(255, 255, 255, 0.78);
      }
      .chat-a .md-step-body {
        padding: 2px 12px 10px 30px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 12.5px;
        line-height: 1.45;
        color: rgba(226, 232, 240, 0.88);
      }
      .chat-a .md-step-body p {
        margin: 8px 0 0;
      }
      .chat-a .md-step-note {
        margin: 2px 0 10px;
        padding-left: 2px;
        color: rgba(226, 232, 240, 0.72);
      }
      .chat-a .md-vault {
        margin: 8px 0;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
        padding: 10px 12px;
        cursor: pointer;
      }
      .chat-a .md-vault:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.18);
      }
      .chat-a .md-vault-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 4px;
      }
      .chat-a .md-vault-kind {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(186, 200, 255, 0.85);
      }
      .chat-a .md-vault-open {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.9);
        font: inherit;
        font-size: 11.5px;
        font-weight: 500;
        line-height: 1;
        padding: 4px 9px;
        cursor: pointer;
      }
      .chat-a .md-vault-open:hover {
        background: rgba(255, 255, 255, 0.16);
      }
      .chat-a .md-vault-title {
        font-size: 13.5px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.92);
        line-height: 1.35;
        word-break: break-word;
      }
      .chat-a .md-vault-preview {
        margin-top: 6px;
        font-size: 12px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.55);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Loading state: the LYKN icon outline drawing on a loop + a shimmer
         status label — identical to the chat page's ThinkingIndicator. */
      .thinking {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 4px 0 8px;
        overflow: visible;
        min-height: 30px;
      }
      /* Shown under the model's description while a build/tool is still
         running — same spinner as the initial thinking state. */
      .building-under {
        margin-top: 12px;
        padding-top: 4px;
        overflow: visible;
      }
      .lykn-outline-spinner {
        color: #f4f6fb;
        transform-box: fill-box;
        transform-origin: center;
        animation: lyknOutlinePop 3.6s ease-in-out infinite;
        flex: none;
        width: 24px;
        height: 24px;
      }
      .lykn-outline-spinner path {
        stroke-dasharray: 1;
        animation: lyknOutlineDraw 3.6s ease-in-out infinite;
      }
      @keyframes lyknOutlineDraw {
        0%   { stroke-dashoffset: 1; stroke-opacity: 1; fill-opacity: 0; }
        40%  { stroke-dashoffset: 0; stroke-opacity: 1; fill-opacity: 0; }
        55%  { stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 1; }
        82%  { stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 1; }
        96%  { stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 0; }
        100% { stroke-dashoffset: 1; stroke-opacity: 0; fill-opacity: 0; }
      }
      @keyframes lyknOutlinePop {
        0%   { transform: scale(0.9); }
        40%  { transform: scale(1); }
        82%  { transform: scale(1); }
        100% { transform: scale(0.9); }
      }
      .thinking-text {
        /* Extra vertical padding so descenders (g/y/p) aren't clipped by
           background-clip:text — that was cutting letters off at the bottom. */
        display: inline-block;
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.5;
        padding: 2px 0 4px;
        overflow: visible;
        white-space: normal;
        background: linear-gradient(
          100deg,
          rgba(255, 255, 255, 0.40) 0%,
          rgba(255, 255, 255, 0.40) 42%,
          rgba(255, 255, 255, 0.90) 50%,
          rgba(255, 255, 255, 0.40) 58%,
          rgba(255, 255, 255, 0.40) 100%
        );
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: lyknThinkingShimmer 2.4s linear infinite;
        will-change: background-position;
      }
      @keyframes lyknThinkingShimmer {
        0%   { background-position: 130% 0; }
        100% { background-position: -130% 0; }
      }

      /* Drag handle — a little window-style tab in the top-left used to move the
         whole panel around. Keeps dragging off the input row so it never fights
         with typing or the live resize. */
      .titlebar {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        height: 28px;
        padding: 4px 10px 0 12px;
        cursor: grab;
      }
      .titlebar.dragging { cursor: grabbing; }
      .titlebar .grip {
        width: 34px;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        transition: background 0.15s ease;
      }
      .titlebar:hover .grip { background: rgba(255, 255, 255, 0.32); }
      .titlebar-spacer { flex: 1; min-width: 8px; }
      /* Active mode — bare blue icon, top-right. Click clears back to chat. */
      .mode-badge {
        -webkit-app-region: no-drag;
        flex: none;
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: #60a5fa;
        background: transparent;
        border: none;
        padding: 0;
        transition: color 0.12s ease, opacity 0.12s ease;
      }
      .mode-badge:hover {
        color: #93c5fd;
        opacity: 1;
      }
      .mode-badge[hidden] { display: none; }
      .mode-badge svg { width: 15px; height: 15px; }

      /* Composer — textarea row + bottom toolbar (matches main app layout). */
      .composer {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px 12px 8px;
        flex: none;
      }
      /* Project scope chip (not a composer mode) — stays above the field. */
      .mode-pill.project-pill {
        -webkit-app-region: no-drag;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        align-self: flex-start;
        margin: 2px 0 0 2px;
        padding: 3px 8px 3px 10px;
        border: 1px solid rgba(96, 165, 250, 0.45);
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.14);
        color: #93c5fd;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
      }
      .mode-pill.project-pill:hover,
      .mode-pill.voice-pill:hover { background: rgba(96, 165, 250, 0.24); }
      .mode-pill.project-pill[hidden],
      .mode-pill.voice-pill[hidden] { display: none; }
      .mode-pill.project-pill svg,
      .mode-pill.voice-pill svg { width: 11px; height: 11px; opacity: 0.85; }
      /* Live voice session chip — click (or Esc) to stop without opening More. */
      .mode-pill.voice-pill {
        -webkit-app-region: no-drag;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        align-self: flex-start;
        margin: 2px 0 0 2px;
        padding: 3px 8px 3px 10px;
        border: 1px solid rgba(96, 165, 250, 0.45);
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.14);
        color: #93c5fd;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
        animation: micPulse 1.4s ease-in-out infinite;
      }
      /* Target language picker — only visible while Translate mode is armed.
         Custom menu (not native <select>) so the list scrolls at a fixed height
         without growing the composer. */
      .lang-pill {
        -webkit-app-region: no-drag;
        position: relative;
        display: inline-flex;
        align-items: center;
        margin: 2px 0 0;
        width: 148px;
        flex: none;
        z-index: 1;
      }
      .lang-pill[hidden] { display: none; }
      .lang-pill-btn {
        -webkit-app-region: no-drag;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 3px 8px 3px 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.78);
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
      }
      .lang-pill-btn:hover,
      .lang-pill.open .lang-pill-btn {
        color: #f4f6fb;
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.18);
      }
      .lang-pill-btn .lang-prefix {
        opacity: 0.7;
        flex: none;
      }
      .lang-pill-btn .lang-value {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
      }
      .lang-pill-btn .lang-chevron {
        width: 11px;
        height: 11px;
        flex: none;
        opacity: 0.7;
        transition: transform 0.12s ease;
      }
      .lang-pill.open .lang-chevron { transform: rotate(180deg); }
      /* Portaled onto #shell and position:fixed so it can hang below #wrap. */
      .lang-menu {
        position: fixed;
        left: 0;
        top: 0;
        width: 180px;
        max-height: 180px;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 4px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--tint);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        z-index: 200;
        -webkit-app-region: no-drag;
      }
      html.no-vibrancy .lang-menu {
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      }
      .lang-menu[hidden] { display: none !important; }
      .lang-option {
        display: block;
        width: 100%;
        padding: 7px 10px;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .lang-option:hover { background: rgba(255, 255, 255, 0.1); }
      .lang-option[aria-selected="true"] {
        background: rgba(255, 255, 255, 0.12);
        font-weight: 600;
      }
      .composer-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .composer-field-row {
        display: flex;
        align-items: flex-start;
        gap: 6px;
      }
      /* Side-panel view picker — toolbar trigger; the option list lives in its
         own floating vibrancy window next to the bar (picker.html), exactly
         like the three-dot menu card. */
      .side-picker-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 30px;
        max-width: 9rem;
        min-width: 0;
        flex: none;
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.75);
        background: transparent;
        border: none;
        border-radius: 10px;
        padding: 0 8px 0 10px;
        cursor: pointer;
        transition: color 0.15s ease, background 0.15s ease;
        -webkit-app-region: no-drag;
      }
      .side-picker-btn:hover,
      .side-picker-btn.active {
        color: #f4f6fb;
        background: rgba(96, 165, 250, 0.14);
      }
      .side-picker-btn:focus { outline: none; }
      .side-picker-btn:focus:not(.active):not(:hover) {
        color: rgba(255, 255, 255, 0.75);
        background: transparent;
      }
      #side-picker-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
      }
      .side-empty {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        padding: 20px 10px;
      }
      .side-text-item {
        font-size: 12px;
        line-height: 1.45;
        color: var(--text);
        padding: 8px 10px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .side-summary {
        font-size: 12px;
        line-height: 1.5;
        color: var(--text);
        padding: 8px 10px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        white-space: pre-wrap;
      }
      .bar-toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-top: 0;
        -webkit-app-region: no-drag;
      }
      .toolbar-spacer { flex: 1; min-width: 4px; }
      .bar-btn {
        -webkit-app-region: no-drag;
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.72);
        background: transparent;
        border: 1px solid transparent;
        padding: 0;
        transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }
      .bar-btn:hover:not(:disabled) {
        color: #f4f6fb;
        background: rgba(255, 255, 255, 0.06);
      }
      .bar-btn svg { width: 14px; height: 14px; }
      .bar-btn.more-btn.active { color: #60a5fa; background: rgba(96, 165, 250, 0.14); }
      /* Collapse-all only makes sense while an answer is expanded — except in
         clean-bar mode, where it stays visible (and tinted) so it can be
         toggled back off. */
      .bar-btn.collapse-all { display: none; }
      .bar-btn.collapse-all.show { display: grid; }
      .bar-btn.collapse-all.active { color: #60a5fa; background: rgba(96, 165, 250, 0.14); }
      /* The three-dot menu now lives in its OWN vibrancy window (menu.html)
         floating next to the bar — window vibrancy fills the whole window
         rect, so an in-window panel could never float on a transparent gap.
         This drawer stays in the DOM permanently hidden: the feature code
         still updates its buttons/badges, and the menu window remote-controls
         them (see __lyknMenuCmd / __lyknMenuState in overlay.js). */
      .more-drawer { display: none; }

      /* More-menu items inside the inline drawer. */
      .menu {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: none;
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 10px;
        background: transparent;
        border: none;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .menu-item:hover { background: rgba(255, 255, 255, 0.1); }
      .menu-item svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
      /* Right-aligned on/off badge for toggle menu items. */
      .menu-state {
        margin-left: auto;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.18);
        color: #60a5fa;
      }
      .menu-item[aria-pressed="false"] .menu-state {
        background: rgba(255, 255, 255, 0.1);
        color: var(--muted);
      }
      .menu-item[aria-pressed="true"] .menu-state {
        background: rgba(52, 211, 153, 0.18);
        color: #34d399;
      }

      .watch-connected-banner {
        font-size: 11px;
        font-weight: 600;
        line-height: 1.4;
        color: #60a5fa;
        padding: 8px 10px;
        margin-bottom: 10px;
        border-radius: 8px;
        background: rgba(37, 99, 235, 0.12);
        border: 1px solid rgba(37, 99, 235, 0.22);
        text-align: center;
      }
      #night-brief {
        display: none;
        flex-direction: column;
        gap: 6px;
        margin: 0 12px 8px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.28);
      }
      #night-brief.show { display: flex; }
      .night-brief-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .night-brief-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #7dd3fc;
      }
      .night-brief-close {
        -webkit-app-region: no-drag;
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        padding: 2px;
        border-radius: 6px;
      }
      .night-brief-close:hover { color: var(--text); background: rgba(255,255,255,0.08); }
      .night-brief-project {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
      }
      .night-brief-body {
        font-size: 12px;
        line-height: 1.45;
        color: #dbeafe;
        max-height: 140px;
        overflow-y: auto;
      }
      .night-brief-body .md-h { font-size: 12px; font-weight: 700; margin: 4px 0; }
      .night-brief-body ul { margin: 4px 0; padding-left: 16px; }
      .night-brief-body li { margin: 2px 0; }
      .watch-side-rules {
        font-size: 11px;
        line-height: 1.45;
        color: var(--muted);
        padding: 6px 8px;
        margin-bottom: 8px;
        border-radius: 8px;
        background: rgba(52, 211, 153, 0.08);
      }
      .watch-install-btn {
        display: block;
        width: 100%;
        margin: 0 0 10px;
        padding: 8px 10px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        background: #2563eb;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .watch-install-btn:hover { background: #1d4ed8; }
      .watch-side-item {
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .watch-side-item.system { opacity: 0.75; }
      .watch-side-item.alert {
        background: rgba(251, 191, 36, 0.1);
        border-color: rgba(251, 191, 36, 0.28);
      }
      .watch-side-meta {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #34d399;
        margin-bottom: 4px;
      }
      .watch-side-item.alert .watch-side-meta { color: #fbbf24; }
      .watch-side-item.system .watch-side-meta { color: var(--muted); }
      .watch-side-text {
        font-size: 13px;
        line-height: 1.45;
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* Active states for the voice / live-notes items moved into this menu. */
      .menu-item.voice-active { color: #60a5fa; background: rgba(96, 165, 250, 0.12); }
      .menu-item.voice-active svg { color: #60a5fa; }
      .menu-item.listening { color: #f87171; background: rgba(248, 113, 113, 0.12); }
      .menu-item.listening svg { color: #f87171; }
      .menu-sep { height: 1px; margin: 4px 6px; background: rgba(255, 255, 255, 0.1); }

      /* Browser control confirmation — shown after planning, before execution. */
      .browser-act {
        display: none;
        flex-direction: column;
        gap: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        margin-top: 4px;
        padding-top: 8px;
      }
      .composer.browser-act-open .browser-act { display: flex; }
      .browser-act-head {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
      }
      .browser-act-steps {
        margin: 0;
        padding: 0 0 0 18px;
        font-size: 12px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.82);
      }
      .browser-act-steps li { margin: 2px 0; }
      .browser-act-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .browser-act-actions button {
        -webkit-app-region: no-drag;
        border: none;
        border-radius: 8px;
        padding: 6px 12px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      #browser-act-cancel {
        color: rgba(255, 255, 255, 0.72);
        background: rgba(255, 255, 255, 0.06);
      }
      #browser-act-run {
        color: #0b0b0f;
        background: #60a5fa;
      }
      #browser-act-run:disabled { opacity: 0.5; cursor: default; }

      /* Past chats sub-view inside the inline drawer. */
      .history-panel {
        display: none;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .history-panel.show { display: flex; }
      .history-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .history-head-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }
      .history-head .spacer { flex: 1; }
      .history-icon-btn {
        -webkit-app-region: no-drag;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: rgba(255, 255, 255, 0.55);
        cursor: pointer;
        transition: background 0.12s ease, color 0.12s ease;
      }
      .history-icon-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }
      .history-icon-btn svg { width: 14px; height: 14px; }
      .history-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 4px 2px;
      }
      .history-group {
        padding: 6px 10px 2px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }
      .history-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        padding: 4px 10px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--text);

      .attachments {

      .chip {

      .dot {

      /* Collapsed state: the whole panel becomes a single LYKN icon bubble. */
      #bubble {

        height: 100%;

        justify-content: center;
        padding: 0;
        background: var(--tint);
        border: 1px solid var(--border);
        border-radius: 16px;
        color: var(--blue);
        cursor: pointer;
        filter: drop-shadow(0 0 3px rgba(59, 120, 255, 0.8))

        transition: transform 0.15s ease, background 0.15s ease;

      /* The prompt field is a textarea so it grows downward as the user types,

      #ask {

        font-family: inherit;

      /* Plain icon mic in the bottom toolbar. */

      .mic.recording {

      .mic.transcribing .ico-mic { display: none; }

      .mic.voice-active {
        color: #60a5fa;
        border-color: rgba(96, 165, 250, 0.4);
        background: rgba(96, 165, 250, 0.1);

      .mic.voice-active .ico-mic { display: none; }
      .mic.voice-active .ico-voice-stop { display: block; }
      @keyframes micPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.0); }
        50% { box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.18); }

      /* Compact glass send — bottom toolbar, aligned with mic/more. */
      .send {
        color: #60a5fa;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(8px) saturate(140%);
        -webkit-backdrop-filter: blur(8px) saturate(140%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transition:
          box-shadow 0.18s ease,
          transform 0.15s ease,
          background 0.18s ease,
          border-color 0.18s ease;
      }
      .send:hover:not(:disabled) {
        background: rgba(96, 165, 250, 0.16);
        border-color: rgba(96, 165, 250, 0.4);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 0 16px rgba(59, 130, 246, 0.18);
      }
      .send:active:not(:disabled) {
        transform: translateY(1px);
        background: rgba(96, 165, 250, 0.22);

          inset 0 0 0 1px rgba(96, 165, 250, 0.25),
          0 0 10px rgba(59, 130, 246, 0.14);
      }
      .send:disabled:not(.busy) { opacity: 0.4; cursor: not-allowed; }
      .send .ico-spin { display: none; animation: spin 0.8s linear infinite; }
      .send.busy .ico-send { display: none; }
      .send.busy .ico-spin { display: block; }
      @keyframes spin { to { transform: rotate(360deg); } }
