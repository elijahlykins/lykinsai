<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LYKN</title>
    <style>
      :root {
        /* Subtle tint laid over the native vibrancy blur for legibility. */
        --tint: rgba(16, 18, 24, 0.28);
        --border: rgba(255, 255, 255, 0.12);
        --divider: rgba(255, 255, 255, 0.10);
        --text: #f4f6fb;
        --muted: #aab2c2;
        --blue: #3b78ff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        width: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        color: var(--text);
      }
      /* One unified glass panel that fills the window. The desktop blur comes
         from native macOS vibrancy; this just adds a faint tint + hairline edge. */
      #wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: var(--tint);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }

      /* Collapsible chat thread (only present once there's a turn). Each turn's
         answer collapses when the next prompt is sent, so the glass grows to fit
         the CURRENT response instead of accumulating forever. */
      #thread {
        display: none;
        max-height: 420px;
        overflow-y: auto;
        overflow-x: hidden;
        border-bottom: 1px solid var(--divider);
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }
      #thread.show { display: block; }
      #thread::-webkit-scrollbar { width: 6px; }
      #thread::-webkit-scrollbar-track { background: transparent; }
      #thread::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 999px;
      }
      #thread::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

      .chat { border-top: 1px solid rgba(255, 255, 255, 0.05); }
      .chat:first-child { border-top: none; }
      /* The user's prompt doubles as a clickable collapse/expand header. */
      .chat-q {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: transparent;
        border: none;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      .chat-q:hover { background: rgba(255, 255, 255, 0.04); }
      .chat-q .chev {
        width: 14px; height: 14px;
        flex: none;
        color: var(--muted);
        transition: transform 0.18s ease;
      }
      .chat.collapsed .chev { transform: rotate(-90deg); }
      .chat-q .q-text {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chat-a {
        padding: 0 16px 14px 38px;
        font-size: 14px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
        color: #e9edf6;
        -webkit-user-select: text;
        user-select: text;
      }
      .chat.collapsed .chat-a { display: none; }
      .chat.collapsed .suggest { display: none; }

      /* Cluely-style suggestions: source links + follow-up questions. */
      .suggest { padding: 2px 16px 14px 38px; }
      .suggest-sec { margin-top: 10px; }
      .suggest-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .suggest-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .suggest-col { display: flex; flex-direction: column; gap: 6px; }
      .suggest-link, .suggest-chip {
        -webkit-app-region: no-drag;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        border-radius: 9px;
        padding: 6px 10px;
        cursor: pointer;
        text-align: left;
        transition: background 0.14s ease, border-color 0.14s ease;
      }
      .suggest-link:hover, .suggest-chip:hover {
        background: rgba(96, 165, 250, 0.14);
        border-color: rgba(96, 165, 250, 0.4);
      }
      .suggest-link { max-width: 100%; }
      .suggest-ico { display: inline-flex; flex: none; color: #60a5fa; }
      .suggest-ico svg { width: 14px; height: 14px; }
      .suggest-link-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 220px;
      }
      .suggest-chip { justify-content: space-between; width: 100%; }
      .suggest-chip-ico { display: inline-flex; flex: none; color: var(--muted); }
      .suggest-chip-ico svg { width: 13px; height: 13px; }
      .suggest-chip:hover .suggest-chip-ico { color: #60a5fa; }
      /* Rendered Markdown answers: drop pre-wrap so block elements control
         spacing instead of literal newlines doubling it up. */
      .chat-a.has-md { white-space: normal; }
      .chat-a.has-md > :first-child { margin-top: 0; }
      .chat-a.has-md > :last-child { margin-bottom: 0; }
      .chat-a .md-h {
        font-size: 14px;
        font-weight: 700;
        color: #f4f6fb;
        margin: 12px 0 5px;
      }
      .chat-a p { margin: 0 0 8px; }
      .chat-a ul, .chat-a ol { margin: 5px 0 9px; padding-left: 20px; }
      .chat-a li { margin: 3px 0; }
      .chat-a strong { font-weight: 700; color: #f4f6fb; }
      .chat-a em { font-style: italic; }
      .chat-a a { color: #60a5fa; text-decoration: underline; }
      .chat-a code {
        background: rgba(255, 255, 255, 0.09);
        padding: 1px 5px;
        border-radius: 5px;
        font-size: 12.5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* Loading state: the LYKN icon outline drawing on a loop + a shimmer
         status label — identical to the chat page's ThinkingIndicator. */
      .thinking {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 2px 0 4px;
      }
      .lykn-outline-spinner {
        color: #f4f6fb;
        transform-box: fill-box;
        transform-origin: center;
        animation: lyknOutlinePop 3.6s ease-in-out infinite;
        flex: none;
      }
      .lykn-outline-spinner path {
        stroke-dasharray: 1;
        animation: lyknOutlineDraw 3.6s ease-in-out infinite;
      }
      @keyframes lyknOutlineDraw {
        0%   { stroke-dashoffset: 1; stroke-opacity: 1; fill-opacity: 0; }
        40%  { stroke-dashoffset: 0; stroke-opacity: 1; fill-opacity: 0; }
        55%  { stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 1; }
        82%  { stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 1; }
        96%  { stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 0; }
        100% { stroke-dashoffset: 1; stroke-opacity: 0; fill-opacity: 0; }
      }
      @keyframes lyknOutlinePop {
        0%   { transform: scale(0.9); }
        40%  { transform: scale(1); }
        82%  { transform: scale(1); }
        100% { transform: scale(0.9); }
      }
      .thinking-text {
        display: inline-block;
        font-size: 13px;
        font-weight: 500;
        background: linear-gradient(
          100deg,
          rgba(255, 255, 255, 0.40) 0%,
          rgba(255, 255, 255, 0.40) 42%,
          rgba(255, 255, 255, 0.90) 50%,
          rgba(255, 255, 255, 0.40) 58%,
          rgba(255, 255, 255, 0.40) 100%
        );
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: lyknThinkingShimmer 2.4s linear infinite;
        will-change: background-position;
      }
      @keyframes lyknThinkingShimmer {
        0%   { background-position: 130% 0; }
        100% { background-position: -130% 0; }
      }

      /* Drag handle — a little window-style tab in the top-left used to move the
         whole panel around. Keeps dragging off the input row so it never fights
         with typing or the live resize. */
      .titlebar {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        height: 22px;
        padding: 0 12px;
        cursor: grab;
      }
      .titlebar.dragging { cursor: grabbing; }
      .titlebar .grip {
        width: 34px;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        transition: background 0.15s ease;
      }
      .titlebar:hover .grip { background: rgba(255, 255, 255, 0.32); }
      /* 3-dot "more" button in the title strip (not part of the drag region). */
      .more-btn {
        width: 22px;
        height: 18px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.5);
        background: transparent;
        border: none;
        padding: 0;
        transition: color 0.15s ease, background 0.15s ease;
      }
      .more-btn:hover, .more-btn.open { color: #fff; background: rgba(255, 255, 255, 0.1); }
      .more-btn svg { width: 16px; height: 16px; }

      /* "Hamburger" panel — a detached floating glass card (kept in the layout
         flow so the window grows to fit it; styled to read as a popover panel,
         like the app's + menu). */
      .menu {
        display: none;
        flex-direction: column;
        margin: 2px 8px 6px;
        padding: 4px;
        gap: 2px;
        /* No card: blend straight into the panel's glass background so it reads
           as a clear section, not a floating popover. */
        background: transparent;
        border: none;
        box-shadow: none;
      }
      .menu.show { display: flex; }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 10px;
        background: transparent;
        border: none;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .menu-item:hover { background: rgba(255, 255, 255, 0.1); }
      .menu-item svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
      .menu-sep { height: 1px; margin: 4px 6px; background: rgba(255, 255, 255, 0.1); }

      /* Drag-and-drop highlight when files hover over the panel. */
      #wrap.dropping { box-shadow: inset 0 0 0 2px rgba(96, 165, 250, 0.65); }
      .drop-hint {
        display: none;
        padding: 6px 16px 0;
        font-size: 12px;
        color: #93c5fd;
      }
      #wrap.dropping .drop-hint { display: block; }

      /* Attachment chips for dropped files. */
      .attachments {
        display: none;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 12px 0;
      }
      .attachments.show { display: flex; }
      .chip {
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 220px;
        padding: 4px 6px 4px 4px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 12px;
        color: var(--text);
      }
      .chip img {
        width: 26px; height: 26px;
        border-radius: 6px;
        object-fit: cover;
        flex: none;
      }
      .chip .chip-ico {
        width: 24px; height: 24px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.08);
        color: var(--muted);
        flex: none;
      }
      .chip .chip-ico svg { width: 14px; height: 14px; }
      .chip .chip-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip .chip-x {
        flex: none;
        cursor: pointer;
        color: var(--muted);
        width: 16px; height: 16px;
        display: grid;
        place-items: center;
        border-radius: 4px;
      }
      .chip .chip-x:hover { color: #fff; background: rgba(255, 255, 255, 0.14); }
      .chip .chip-x svg { width: 12px; height: 12px; }

      /* The input row, part of the same glass panel. */
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 12px 10px 16px;
      }
      /* LYKN mark as a glowing blue edge (outline only, transparent fill). Also
         doubles as the "collapse" button — click it to shrink to the bubble. */
      .dot {
        width: 20px; height: 20px;
        flex: none;
        color: var(--blue);
        cursor: pointer;
        -webkit-app-region: no-drag;
        filter: drop-shadow(0 0 3px rgba(59, 120, 255, 0.85))
          drop-shadow(0 0 6px rgba(59, 120, 255, 0.5));
        transition: transform 0.2s ease, opacity 0.2s ease;
      }
      .dot:hover { transform: scale(1.12); }

      /* Collapsed state: the whole panel becomes a single LYKN icon bubble. */
      #bubble {
        display: none;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: var(--tint);
        border: 1px solid var(--border);
        border-radius: 16px;
        color: var(--blue);
        cursor: pointer;
        filter: drop-shadow(0 0 3px rgba(59, 120, 255, 0.8))
          drop-shadow(0 0 6px rgba(59, 120, 255, 0.45));
        transition: transform 0.15s ease, background 0.15s ease;
      }
      #bubble:hover { transform: scale(1.06); background: rgba(40, 44, 54, 0.42); }
      #bubble:active { transform: scale(0.96); }
      #bubble svg { width: 28px; height: 28px; }
      #bubble svg path { fill: none; stroke: currentColor; }
      body.collapsed #wrap { display: none; }
      body.collapsed #bubble { display: flex; }
      .dot path {
        fill: none;
        stroke: currentColor;
      }
      .dot.busy { animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.5; transform:scale(.86)} }

      input {
        -webkit-app-region: no-drag;
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 15px;
        padding: 6px 2px;
      }
      input::placeholder { color: var(--muted); }

      .hint {
        -webkit-app-region: no-drag;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      kbd {
        font-family: inherit;
        background: rgba(255,255,255,0.1);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 11px;
      }
      /* Plain icon mic button for dictation (mirrors the app's toolbar mic). */
      .mic {
        -webkit-app-region: no-drag;
        flex: none;
        width: 36px; height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: #aab2c2;
        background: transparent;
        border: 1px solid transparent;
        transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }
      .mic:hover:not(:disabled) { color: #f4f6fb; background: rgba(255, 255, 255, 0.06); }
      .mic:disabled { opacity: 0.45; cursor: not-allowed; }
      .mic svg { width: 16px; height: 16px; }
      .mic .ico-mic-spin { display: none; animation: spin 0.8s linear infinite; }
      .mic.recording {
        color: #60a5fa;
        border-color: rgba(96, 165, 250, 0.4);
        background: rgba(96, 165, 250, 0.1);
        animation: micPulse 1.4s ease-in-out infinite;
      }
      .mic.transcribing .ico-mic { display: none; }
      .mic.transcribing .ico-mic-spin { display: block; }
      .mic.voice-active {
        color: #60a5fa;
        border-color: rgba(96, 165, 250, 0.4);
        background: rgba(96, 165, 250, 0.1);
        animation: micPulse 1.4s ease-in-out infinite;
      }
      @keyframes micPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.0); }
        50% { box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.18); }
      }

      /* Glass send button — translucent, blurred, no grey fill. */
      .send {
        -webkit-app-region: no-drag;
        flex: none;
        width: 36px; height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: #60a5fa;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(8px) saturate(140%);
        -webkit-backdrop-filter: blur(8px) saturate(140%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transition:
          box-shadow 0.18s ease,
          transform 0.15s ease,
          background 0.18s ease,
          border-color 0.18s ease;
      }
      .send:hover:not(:disabled) {
        background: rgba(96, 165, 250, 0.16);
        border-color: rgba(96, 165, 250, 0.4);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 0 16px rgba(59, 130, 246, 0.18);
      }
      .send:active:not(:disabled) {
        transform: translateY(1px);
        background: rgba(96, 165, 250, 0.22);
        box-shadow:
          inset 0 0 0 1px rgba(96, 165, 250, 0.25),
          0 0 10px rgba(59, 130, 246, 0.14);
      }
      .send:disabled:not(.busy) { opacity: 0.4; cursor: not-allowed; }
      .send svg { width: 16px; height: 16px; }
      .send .ico-spin { display: none; animation: spin 0.8s linear infinite; }
      .send.busy .ico-send { display: none; }
      .send.busy .ico-spin { display: block; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Live-listen (meeting notes) panel. */
      #live { display: none; flex-direction: column; padding: 6px 14px 2px; }
      #live.show { display: flex; }
      .live-head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .live-dot {
        flex: none;
        width: 7px; height: 7px; border-radius: 50%;
        background: #6b7280;
      }
      .live-dot.live {
        background: #ef4444;
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.7);
        animation: livePulse 1.4s ease-in-out infinite;
      }
      .live-title { flex: none; }
      @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      .live-tabs {
        display: flex;
        gap: 4px;
        margin-left: auto;
      }
      .live-tab {
        -webkit-app-region: no-drag;
        border: none;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 7px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .live-tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
      .live-tab.active { color: var(--text); background: rgba(255, 255, 255, 0.1); }
      .live-close {
        -webkit-app-region: no-drag;
        flex: none;
        display: grid;
        place-items: center;
        width: 20px; height: 20px;
        border: none;
        background: transparent;
        color: var(--muted);
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .live-close:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); }
      .live-close svg { width: 14px; height: 14px; }
      .live-pane { max-height: 260px; overflow-y: auto; }
      .notes-summary {
        font-size: 13px;
        line-height: 1.5;
        color: var(--text);
      }
      .notes-summary:empty::after {
        content: "Listening… notes will appear as the conversation builds.";
        color: var(--muted);
        font-style: italic;
      }
      .notes-section { margin-top: 10px; }
      .notes-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .notes-list { list-style: none; margin: 0; padding: 0; }
      .notes-list li {
        position: relative;
        padding-left: 16px;
        font-size: 13px;
        line-height: 1.45;
        color: var(--text);
        margin-bottom: 4px;
      }
      .notes-list li::before {
        content: "";
        position: absolute;
        left: 3px; top: 8px;
        width: 4px; height: 4px;
        border-radius: 50%;
        background: var(--muted);
      }
      .notes-list.actions li::before {
        content: "";
        left: 2px; top: 4px;
        width: 9px; height: 9px;
        border-radius: 3px;
        background: transparent;
        border: 1.5px solid #60a5fa;
      }
      .live-body {
        max-height: 240px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.5;
        color: var(--text);
        word-break: break-word;
      }
      .live-body:empty::after {
        content: "Capturing audio… speech will appear here.";
        color: var(--muted);
        font-style: italic;
      }
      .live-line { margin-bottom: 7px; }
      .live-line:last-child { margin-bottom: 0; }
      .live-speaker {
        display: inline-block;
        margin-right: 7px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        vertical-align: 1px;
      }
      .live-line.you .live-speaker { color: #60a5fa; }   /* the user */
      .live-line.them .live-speaker { color: #34d399; }  /* video / other person */
      .live-text { color: var(--text); }
      /* Listen button active state (reuses .mic). */
      .mic.listening { color: #f87171; }
      .mic.listening svg { animation: micPulse 1.4s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <button id="bubble" title="Open LYKN" aria-label="Open LYKN">
      <svg viewBox="0 0 204.29 204.29" fill="none" aria-hidden="true">
