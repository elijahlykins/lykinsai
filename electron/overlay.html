<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LYKN</title>
    <style>
      :root {
        /* Subtle tint laid over the native vibrancy blur for legibility. */
        --tint: rgba(16, 18, 24, 0.28);
        --border: rgba(255, 255, 255, 0.12);
        --divider: rgba(255, 255, 255, 0.10);
        --text: #f4f6fb;
        --muted: #aab2c2;
        --blue: #3b78ff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        width: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        color: var(--text);
      }
      /* One unified glass panel that fills the window. The desktop blur comes
         from native macOS vibrancy; this just adds a faint tint + hairline edge. */
      #wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: var(--tint);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }

      /* Collapsible chat thread (only present once there's a turn). Each turn's
         answer collapses when the next prompt is sent, so the glass grows to fit
         the CURRENT response instead of accumulating forever. */
      #thread {
        display: none;
        max-height: 420px;
        overflow-y: auto;
        overflow-x: hidden;
        border-bottom: 1px solid var(--divider);
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }
      #thread.show { display: block; }
      #thread::-webkit-scrollbar { width: 6px; }
      #thread::-webkit-scrollbar-track { background: transparent; }
      #thread::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 999px;
      }
      #thread::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

      .chat { border-top: 1px solid rgba(255, 255, 255, 0.05); }
      .chat:first-child { border-top: none; }
      /* The user's prompt doubles as a clickable collapse/expand header. */
      .chat-q {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        background: transparent;
        border: none;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      .chat-q:hover { background: rgba(255, 255, 255, 0.04); }
      .chat-q .chev {
        width: 14px; height: 14px;
        flex: none;
        color: var(--muted);
        transition: transform 0.18s ease;
      }
      .chat.collapsed .chev { transform: rotate(-90deg); }
      .chat-q .q-text {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chat-a {
        padding: 0 16px 14px 38px;
        font-size: 14px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
        color: #e9edf6;
        -webkit-user-select: text;
        user-select: text;
      }
      .chat.collapsed .chat-a { display: none; }

      /* Loading state: the LYKN icon outline drawing on a loop + a shimmer
         status label — identical to the chat page's ThinkingIndicator. */
      .thinking {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 2px 0 4px;
      }
      .lykn-outline-spinner {
        color: #f4f6fb;
        transform-box: fill-box;
        transform-origin: center;
        animation: lyknOutlinePop 3.6s ease-in-out infinite;
        flex: none;
      }
      .lykn-outline-spinner path {
        stroke-dasharray: 1;
        animation: lyknOutlineDraw 3.6s ease-in-out infinite;
      }
      @keyframes lyknOutlineDraw {
        0%   { stroke-dashoffset: 1; stroke-opacity: 1; fill-opacity: 0; }
        40%  { stroke-dashoffset: 0; stroke-opacity: 1; fill-opacity: 0; }
        55%  { stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 1; }
        82%  { stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 1; }
        96%  { stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 0; }
        100% { stroke-dashoffset: 1; stroke-opacity: 0; fill-opacity: 0; }
      }
      @keyframes lyknOutlinePop {
        0%   { transform: scale(0.9); }
        40%  { transform: scale(1); }
        82%  { transform: scale(1); }
        100% { transform: scale(0.9); }
      }
      .thinking-text {
        display: inline-block;
        font-size: 13px;
        font-weight: 500;
        background: linear-gradient(
          100deg,
          rgba(255, 255, 255, 0.40) 0%,
          rgba(255, 255, 255, 0.40) 42%,
          rgba(255, 255, 255, 0.90) 50%,
          rgba(255, 255, 255, 0.40) 58%,
          rgba(255, 255, 255, 0.40) 100%
        );
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: lyknThinkingShimmer 2.4s linear infinite;
        will-change: background-position;
      }
      @keyframes lyknThinkingShimmer {
        0%   { background-position: 130% 0; }
        100% { background-position: -130% 0; }
      }

      /* Drag handle — a little window-style tab in the top-left used to move the
         whole panel around. Keeps dragging off the input row so it never fights
         with typing or the live resize. */
      .titlebar {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        height: 22px;
        padding: 0 12px;
        cursor: grab;
      }
      .titlebar.dragging { cursor: grabbing; }
      .titlebar .grip {
        width: 34px;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        transition: background 0.15s ease;
      }
      .titlebar:hover .grip { background: rgba(255, 255, 255, 0.32); }
      /* 3-dot "more" button in the title strip (not part of the drag region). */
      .more-btn {
        width: 22px;
        height: 18px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.5);
        background: transparent;
        border: none;
        padding: 0;
        transition: color 0.15s ease, background 0.15s ease;
      }
      .more-btn:hover, .more-btn.open { color: #fff; background: rgba(255, 255, 255, 0.1); }
      .more-btn svg { width: 16px; height: 16px; }

      /* "Hamburger" panel — a detached floating glass card (kept in the layout
         flow so the window grows to fit it; styled to read as a popover panel,
         like the app's + menu). */
      .menu {
        display: none;
        flex-direction: column;
        margin: 4px 8px 8px;
        padding: 6px;
        gap: 2px;
        border-radius: 14px;
        background: rgba(28, 31, 38, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
      }
      .menu.show { display: flex; }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 10px;
        background: transparent;
        border: none;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .menu-item:hover { background: rgba(255, 255, 255, 0.1); }
      .menu-item svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
      .menu-sep { height: 1px; margin: 4px 6px; background: rgba(255, 255, 255, 0.1); }

      /* Drag-and-drop highlight when files hover over the panel. */
      #wrap.dropping { box-shadow: inset 0 0 0 2px rgba(96, 165, 250, 0.65); }
      .drop-hint {
        display: none;
        padding: 6px 16px 0;
        font-size: 12px;
        color: #93c5fd;
      }
      #wrap.dropping .drop-hint { display: block; }

      /* Attachment chips for dropped files. */
      .attachments {
        display: none;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 12px 0;
      }
      .attachments.show { display: flex; }
      .chip {
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 220px;
        padding: 4px 6px 4px 4px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 12px;
        color: var(--text);
      }
      .chip img {
        width: 26px; height: 26px;
        border-radius: 6px;
        object-fit: cover;
        flex: none;
      }
      .chip .chip-ico {
        width: 24px; height: 24px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.08);
        color: var(--muted);
        flex: none;
      }
      .chip .chip-ico svg { width: 14px; height: 14px; }
      .chip .chip-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip .chip-x {
        flex: none;
        cursor: pointer;
        color: var(--muted);
        width: 16px; height: 16px;
        display: grid;
        place-items: center;
        border-radius: 4px;
      }
      .chip .chip-x:hover { color: #fff; background: rgba(255, 255, 255, 0.14); }
      .chip .chip-x svg { width: 12px; height: 12px; }

      /* The input row, part of the same glass panel. */
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 12px 10px 16px;
      }
      /* LYKN mark as a glowing blue edge (outline only, transparent fill). */
      .dot {
        width: 20px; height: 20px;
        flex: none;
        color: var(--blue);
        filter: drop-shadow(0 0 3px rgba(59, 120, 255, 0.85))
          drop-shadow(0 0 6px rgba(59, 120, 255, 0.5));
        transition: transform 0.2s ease, opacity 0.2s ease;
      }
      .dot path {
        fill: none;
        stroke: currentColor;
      }
      .dot.busy { animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.5; transform:scale(.86)} }

      input {
        -webkit-app-region: no-drag;
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 15px;
        padding: 6px 2px;
      }
      input::placeholder { color: var(--muted); }

      .hint {
        -webkit-app-region: no-drag;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      kbd {
        font-family: inherit;
        background: rgba(255,255,255,0.1);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 11px;
      }
      /* Plain icon mic button for dictation (mirrors the app's toolbar mic). */
      .mic {
        -webkit-app-region: no-drag;
        flex: none;
        width: 36px; height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: #aab2c2;
        background: transparent;
        border: 1px solid transparent;
        transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }
      .mic:hover:not(:disabled) { color: #f4f6fb; background: rgba(255, 255, 255, 0.06); }
      .mic:disabled { opacity: 0.45; cursor: not-allowed; }
      .mic svg { width: 16px; height: 16px; }
      .mic .ico-mic-spin { display: none; animation: spin 0.8s linear infinite; }
      .mic.recording {
        color: #60a5fa;
        border-color: rgba(96, 165, 250, 0.4);
        background: rgba(96, 165, 250, 0.1);
        animation: micPulse 1.4s ease-in-out infinite;
      }
      .mic.transcribing .ico-mic { display: none; }
      .mic.transcribing .ico-mic-spin { display: block; }
      .mic.voice-active {
        color: #60a5fa;
        border-color: rgba(96, 165, 250, 0.4);
        background: rgba(96, 165, 250, 0.1);
        animation: micPulse 1.4s ease-in-out infinite;
      }
      @keyframes micPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.0); }
        50% { box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.18); }
      }

      /* Matches the app's neumorphic chat send button (dark variant). */
      .send {
        -webkit-app-region: no-drag;
        flex: none;
        width: 36px; height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: #60a5fa;
        background: linear-gradient(145deg, #383c44, #2a2e35);
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow:
          3px 3px 8px rgba(0, 0, 0, 0.45),
          -2px -2px 6px rgba(255, 255, 255, 0.02);
        transition:
          box-shadow 0.18s ease,
          transform 0.15s ease,
          background 0.18s ease,
          border-color 0.18s ease;
      }
      .send:hover:not(:disabled) {
        background: linear-gradient(145deg, #2e3848, #283040);
        border-color: rgba(96, 165, 250, 0.32);
        box-shadow:
          3px 3px 8px rgba(0, 0, 0, 0.4),
          -1px -1px 5px rgba(255, 255, 255, 0.03),
          0 0 16px rgba(59, 130, 246, 0.16);
      }
      .send:active:not(:disabled) {
        transform: translateY(1px);
        box-shadow:
          inset 2px 2px 6px rgba(0, 0, 0, 0.45),
          inset -1px -1px 4px rgba(255, 255, 255, 0.03),
          0 0 0 1px rgba(96, 165, 250, 0.15);
      }
      .send:disabled:not(.busy) { opacity: 0.4; cursor: not-allowed; }
      .send svg { width: 16px; height: 16px; }
      .send .ico-spin { display: none; animation: spin 0.8s linear infinite; }
      .send.busy .ico-send { display: none; }
      .send.busy .ico-spin { display: block; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div class="titlebar" id="drag" title="Drag to move">
        <span class="grip"></span>
        <button class="more-btn" id="more" title="More" aria-label="More">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="5" cy="12" r="1.6" />
            <circle cx="12" cy="12" r="1.6" />
            <circle cx="19" cy="12" r="1.6" />
          </svg>
        </button>
      </div>
      <div class="menu" id="menu">
        <button class="menu-item" id="menu-attach" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48" />
          </svg>
          Add photos &amp; files
        </button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="menu-open" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h6v6" />
            <path d="M10 14 21 3" />
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          </svg>
          Open LYKN app
        </button>
      </div>
      <div id="thread"></div>
      <div class="drop-hint">Drop files to attach…</div>
      <div class="attachments" id="attachments"></div>
      <div class="bar">
        <svg class="dot" id="dot" viewBox="0 0 204.29 204.29" fill="none" aria-hidden="true">
          <path d="M167.39,60.26l-.86-.39c-9.83-4.41-17.7-12.28-22.12-22.12l-.39-.86c-1.77-3.94-7.36-3.94-9.13,0l-.39.86c-4.41,9.83-12.28,17.71-22.12,22.12l-.86.39c-3.94,1.77-3.94,7.36,0,9.13l.86.39c9.83,4.41,17.7,12.28,22.12,22.12l.39.86c1.77,3.94,7.36,3.94,9.13,0l.39-.86c4.41-9.83,12.28-17.7,22.12-22.12l.86-.39c3.94-1.77,3.94-7.36,0-9.13ZM134.87,116.05c-14.73,2.8-17.97,18.72-32.73,18.72-8.11,0-12.75-4.81-17.72-9.61-1.8-1.73-3.56-3.5-5.29-5.29-4.8-4.98-9.62-9.61-9.62-17.73,0-14.76,15.93-18,18.72-32.73,2.66-14.03-7.74-27.55-21.99-28.38-13.8-.8-25.24,10.16-25.24,23.79,0,18.8,19.14,21.14,19.14,37.32s-19.14,18.52-19.14,37.32c0,13.16,10.67,23.83,23.83,23.83,18.8,0,21.14-19.14,37.32-19.14s18.52,19.14,37.32,19.14c13.63,0,24.58-11.44,23.78-25.24-.82-14.25-14.35-24.66-28.38-21.99Z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
        </svg>
        <input id="ask" type="text" placeholder="Ask LYKN about your screen…" autocomplete="off" />
        <span class="hint"><kbd>↵</kbd> ask · <kbd>esc</kbd> close</span>
        <button class="mic" id="voice" title="Voice mode" aria-label="Voice mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 10v3" />
            <path d="M6 6v11" />
            <path d="M10 3v18" />
            <path d="M14 8v7" />
            <path d="M18 5v13" />
            <path d="M22 10v3" />
          </svg>
        </button>
        <button class="mic" id="mic" title="Dictate" aria-label="Dictate">
          <svg class="ico-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" x2="12" y1="19" y2="22" />
          </svg>
          <svg class="ico-mic-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
        </button>
        <button class="send" id="send" title="Send" aria-label="Send">
          <svg class="ico-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m5 12 7-7 7 7" />
            <path d="M12 19V5" />
          </svg>
          <svg class="ico-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
        </button>
      </div>
    </div>
    <script src="vendor/elevenlabs-client.iife.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
