<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New tab</title>
    <style>
      * { box-sizing: border-box; }
      * { scrollbar-width: none !important; }
      *::-webkit-scrollbar { display: none !important; }

      html, body {
        margin: 0;
        height: 100%;
        background: #fff;
        color: #101215;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      .stage {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px 9vh;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: clamp(32px, 5vh, 48px);
        /* Landing page brand blue (--lkn-sky). */
        color: #0968c4;
      }
      .brand .mark {
        display: block;
        width: 64px;
        height: 64px;
      }
      .brand .wordmark {
        display: block;
        /* ViewBox has vertical padding — oversize so the glyphs match the mark. */
        height: 58px;
        width: auto;
      }
      .brand svg path { fill: currentColor; }

      .search {
        position: relative;
        width: min(560px, 84vw);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 52px;
        padding: 0 10px 0 16px;
        border: 1px solid rgba(16, 18, 21, 0.08);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 10px 30px rgba(16, 18, 21, 0.08), 0 1px 3px rgba(16, 18, 21, 0.05);
        transition: box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
      }
      .bar:hover,
      .bar:focus-within {
        border-color: rgba(16, 18, 21, 0.14);
        background: #fff;
        box-shadow: 0 14px 38px rgba(16, 18, 21, 0.12), 0 1px 3px rgba(16, 18, 21, 0.06);
      }
      .bar input {
        flex: 1;
        min-width: 0;
        height: 100%;
        border: 0;
        outline: none;
        background: transparent;
        color: #101215;
        font: 15.5px/1.4 inherit;
        letter-spacing: -0.01em;
        user-select: text;
        -webkit-user-select: text;
      }
      .bar input::placeholder { color: #9aa1a8; }

      .icon-btn {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #6b7178;
        cursor: pointer;
      }
      .icon-btn:hover { background: rgba(16, 18, 21, 0.06); color: #101215; }
      .icon-btn svg { width: 19px; height: 19px; }
      .icon-btn.is-live { color: #1a4ee2; background: #e8f0fe; }

      /* Same dropdown as the omnibox up top (shared omniboxSuggest.js). */
      #q-suggest {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 8px);
        max-height: min(340px, 42vh);
        overflow-y: auto;
        overscroll-behavior: contain;
        background: #fff;
        border: 1px solid rgba(16, 18, 21, 0.08);
        border-radius: 18px;
        box-shadow: 0 1px 2px rgba(16, 18, 21, 0.06), 0 14px 38px rgba(16, 18, 21, 0.14);
        z-index: 20;
        padding: 6px 0;
      }
      #q-suggest[hidden] { display: none; }
      #q-suggest .suggest-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 44px;
        border: none;
        background: transparent;
        color: #101215;
        text-align: left;
        padding: 8px 18px;
        cursor: pointer;
        font: inherit;
      }
      #q-suggest .suggest-item:hover,
      #q-suggest .suggest-item.active { background: rgba(16, 18, 21, 0.05); }
      #q-suggest .suggest-ico {
        flex: none;
        width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
        color: #6b7178;
        opacity: 0.9;
      }
      #q-suggest .suggest-ico svg { display: block; width: 18px; height: 18px; }
      #q-suggest .suggest-ico img {
        display: block;
        width: 16px;
        height: 16px;
        border-radius: 3px;
        object-fit: contain;
      }
      #q-suggest .meta {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #q-suggest .name {
        font-size: 13.5px;
        line-height: 1.25;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #q-suggest .host {
        font-size: 12px;
        line-height: 1.25;
        color: #6b7178;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .home-msg {
        margin: 12px 4px 0;
        font-size: 13px;
        text-align: center;
        color: #d93025;
      }
      .home-msg[hidden] { display: none; }

      @media (max-width: 1100px) {
        .brand .mark { width: 54px; height: 54px; }
        .brand .wordmark { height: 49px; }
        .brand { gap: 3px; }
        .bar { height: 48px; border-radius: 24px; padding: 0 8px 0 14px; }
        .bar input { font: 15px/1.4 inherit; }
        .icon-btn { width: 34px; height: 34px; }
        .icon-btn svg { width: 18px; height: 18px; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="brand" aria-label="LYKN">
        <svg class="mark" viewBox="0 0 204.29 204.29" role="img" aria-hidden="true">
          <path d="M167.39,60.26l-.86-.39c-9.83-4.41-17.7-12.28-22.12-22.12l-.39-.86c-1.77-3.94-7.36-3.94-9.13,0l-.39.86c-4.41,9.83-12.28,17.71-22.12,22.12l-.86.39c-3.94,1.77-3.94,7.36,0,9.13l.86.39c9.83,4.41,17.7,12.28,22.12,22.12l.39.86c1.77,3.94,7.36,3.94,9.13,0l.39-.86c4.41-9.83,12.28-17.7,22.12-22.12l.86-.39c3.94-1.77,3.94-7.36,0-9.13ZM134.87,116.05c-14.73,2.8-17.97,18.72-32.73,18.72-8.11,0-12.75-4.81-17.72-9.61-1.8-1.73-3.56-3.5-5.29-5.29-4.8-4.98-9.62-9.61-9.62-17.73,0-14.76,15.93-18,18.72-32.73,2.66-14.03-7.74-27.55-21.99-28.38-13.8-.8-25.24,10.16-25.24,23.79,0,18.8,19.14,21.14,19.14,37.32s-19.14,18.52-19.14,37.32c0,13.16,10.67,23.83,23.83,23.83,18.8,0,21.14-19.14,37.32-19.14s18.52,19.14,37.32,19.14c13.63,0,24.58-11.44,23.78-25.24-.82-14.25-14.35-24.66-28.38-21.99Z"/>
        </svg>
        <svg class="wordmark" viewBox="0 0 480.27 194.53" role="img" aria-label="LYKN">
          <path d="M113.42,136.31h-39.19c-2.23,0-4.05-1.82-4.05-4.05V39.72c0-.45-.36-.81-.81-.81h-29.64c-.45,0-.81.36-.81.81v86.71c0,20.57,11.2,29.2,27.65,29.2h46.86c.45,0,.81-.36.81-.81v-17.69c0-.45-.36-.81-.81-.81ZM403.29,36.25c-15.94,0-26.62,7.59-32.83,15.64-1.48,1.92-2.75,1.47-2.75-.96v-11.21c0-.45-.36-.81-.81-.81h-27.94c-.45,0-.81.36-.81.81v115.09c0,.45.36.81.81.81h29.57c.45,0,.81-.36.81-.81v-62.28c0-24.75,10.56-34.37,22.16-34.37s18.66,7.86,18.66,22.14v74.51c0,.45.36.81.81.81h29.57c.45,0,.81-.36.81-.81v-79.75c0-25.52-16.91-38.81-38.08-38.81ZM285.84,84.42c-.54-.9-.4-2.28.31-3.05l37.57-41.1c.48-.52.11-1.36-.6-1.36h-26.05c-.48,0-.93.21-1.24.57l-43.12,50.89c-1.5,1.77-2.72,1.32-2.72-1v-49.65c0-.45-.36-.81-.81-.81h-29.64c-.45,0-.81.36-.81.81v115.09c0,.45.36.81.81.81h29.64c.45,0,.81-.36.81-.81v-31.5c0-1.32.73-3.19,1.61-4.16l10.7-11.72c.79-.86,1.91-.74,2.48.28l26.64,47.09c.29.51.83.82,1.41.82h34.13c.63,0,1.02-.69.7-1.23l-41.83-69.98ZM210.32,38.91h-23.32c-.61,0-1.17.34-1.45.89l-23.86,47.1c-.77,1.51-2.01,1.51-2.76-.01l-23.23-47.07c-.27-.55-.84-.91-1.46-.91h-33.97c-.62,0-1.01.66-.71,1.2l39.62,72.63v42.08c0,.45.36.81.81.81h29.64c.45,0,.81-.36.81-.81v-42.4l40.57-72.29c.3-.54-.09-1.21-.71-1.21Z"/>
        </svg>
      </div>

      <form class="search" id="search-form" action="#" autocomplete="off">
          <div class="bar">
            <button type="submit" class="icon-btn" id="search" title="Search" aria-label="Search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
            </button>
            <input
              id="q"
              name="q"
              type="text"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="off"
              placeholder="Search the web"
              aria-label="Search the web"
            />
            <button type="button" class="icon-btn" id="mic" title="Dictate" aria-label="Dictate">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
            </button>
          </div>
          <div id="q-suggest" hidden role="listbox" aria-label="Suggestions"></div>
          <p class="home-msg" id="home-msg" hidden></p>
        </form>
    </div>

    <script src="omniboxSuggest.js"></script>
    <script>
      (function () {
        const qEl = document.getElementById("q");
        const form = document.getElementById("search-form");
        const mic = document.getElementById("mic");
        const msgEl = document.getElementById("home-msg");
        const suggestEl = document.getElementById("q-suggest");
        const homeApi = () => window.lyknBrowserHome || {};
        // Same suggestion engine the top omnibox uses (omniboxSuggest.js).
        const suggest = window.lyknOmniboxSuggest || null;

        function omniboxToUrl(input) {
          const q = String(input || "").trim();
          if (!q) return "";
          if (/^https?:\/\//i.test(q)) return q;
          const hostish =
            !/\s/.test(q) &&
            (/^localhost(:\d+)?([/?#]|$)/i.test(q) ||
              /^\d{1,3}(\.\d{1,3}){3}(:\d+)?([/?#]|$)/.test(q) ||
              /^[a-z0-9-]+(\.[a-z0-9-]+)+(:\d+)?([/?#]|$)/i.test(q));
          if (hostish) return `https://${q}`;
          return "https://www.google.com/search?q=" + encodeURIComponent(q);
        }

        let recorder = null;
        let mediaStream = null;
        let audioChunks = [];
        let dictating = false;
        let transcribing = false;
        const SEARCH_PLACEHOLDER = "Search the web";
        const RECORD_MIME = (() => {
          try {
            return MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
              ? "audio/webm;codecs=opus"
              : "audio/webm";
          } catch (_) {
            return "audio/webm";
          }
        })();

        function showMsg(text) {
          if (!text) {
            msgEl.hidden = true;
            msgEl.textContent = "";
            return;
          }
          msgEl.hidden = false;
          msgEl.textContent = text;
        }

        function setMicState() {
          mic.classList.toggle("is-live", dictating);
          mic.disabled = transcribing;
          mic.title = dictating ? "Stop recording" : transcribing ? "Transcribing…" : "Dictate";
          mic.setAttribute("aria-label", mic.title);
          if (dictating) qEl.placeholder = "Listening…";
          else if (transcribing) qEl.placeholder = "Transcribing…";
          else qEl.placeholder = SEARCH_PLACEHOLDER;
        }

        function go() {
          const url = omniboxToUrl(qEl.value);
          if (!url) {
            qEl.focus();
            return;
          }
          location.assign(url);
        }

        form.addEventListener("submit", (e) => {
          e.preventDefault();
          go();
        });

        /* ── Suggestions dropdown — identical list to the top omnibox ── */

        const GLOBE_SVG =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" stroke-linecap="round"/></svg>';
        const SEARCH_SVG =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>';
        const CLOCK_SVG =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        function escapeHtml(s) {
          return String(s || "").replace(
            /[&<>"']/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
          );
        }

        let suggestOpen = false;
        let suggestItems = [];
        let suggestIndex = -1;
        let suggestData = { tabs: [], history: [] };
        let suggestDataAt = 0;

        async function refreshSuggestData() {
          const api = homeApi();
          if (typeof api.suggestData !== "function") return;
          if (Date.now() - suggestDataAt < 15000) return;
          try {
            const res = await api.suggestData();
            if (res && res.ok) {
              suggestData = {
                tabs: Array.isArray(res.tabs) ? res.tabs : [],
                history: Array.isArray(res.history) ? res.history : [],
              };
              suggestDataAt = Date.now();
              if (suggestOpen) renderSuggest();
            }
          } catch (_) {}
        }

        function renderSuggest() {
          if (!suggestEl || !suggest) return;
          suggestItems = suggest.buildUrlSuggestions(qEl.value, suggestData);
          suggestIndex = -1;
          if (!suggestOpen || !suggestItems.length) {
            suggestEl.hidden = true;
            suggestEl.innerHTML = "";
            return;
          }
          const iconFor = (it) => {
            if (it.kind === "Search") return SEARCH_SVG;
            const fav = suggest.faviconUrlFor(it.url, it.favicon);
            if (fav) {
              return '<img src="' + escapeHtml(fav) + '" alt="" loading="lazy" referrerpolicy="no-referrer" data-fallback="globe" />';
            }
            if (it.kind === "Recent" || it.kind === "Tab") return CLOCK_SVG;
            return GLOBE_SVG;
          };
          suggestEl.innerHTML = suggestItems
            .map((it, i) => {
              const host =
                it.kind === "Search"
                  ? "Google Search"
                  : suggest.stripUrlDecor(it.url) || suggest.hostLabel(it.url) || it.url;
              const title =
                it.kind === "Search"
                  ? it.name.replace(/^Search Google for\s+[“"](.+)[”"]$/i, "$1")
                  : it.name || host;
              return (
                '<button type="button" class="suggest-item" role="option" data-idx="' + i + '">' +
                '<span class="suggest-ico" aria-hidden="true">' + iconFor(it) + "</span>" +
                '<div class="meta"><div class="name">' + escapeHtml(title) + "</div>" +
                '<div class="host">' + escapeHtml(host) + "</div></div></button>"
              );
            })
            .join("");
          suggestEl.querySelectorAll("img[data-fallback]").forEach((img) => {
            img.addEventListener(
              "error",
              () => {
                const wrap = document.createElement("span");
                wrap.innerHTML = GLOBE_SVG;
                img.replaceWith(wrap.firstChild || wrap);
              },
              { once: true },
            );
          });
          suggestEl.hidden = false;
        }

        function setSuggestOpen(open) {
          suggestOpen = !!open;
          if (suggestOpen) {
            void refreshSuggestData();
            renderSuggest();
          } else if (suggestEl) {
            suggestEl.hidden = true;
            suggestEl.innerHTML = "";
          }
        }

        function markActiveSuggest() {
          suggestEl.querySelectorAll(".suggest-item").forEach((el, i) => {
            el.classList.toggle("active", i === suggestIndex);
          });
        }

        qEl.addEventListener("input", () => {
          if (!suggestOpen) setSuggestOpen(true);
          else renderSuggest();
        });
        // The initial programmatic focus shouldn't pop the dropdown — only a
        // real click or keystroke does (same as the omnibox up top).
        let skipSuggestOnce = true;
        qEl.addEventListener("focus", () => {
          if (skipSuggestOnce) {
            skipSuggestOnce = false;
            return;
          }
          setSuggestOpen(true);
        });
        qEl.addEventListener("click", () => {
          if (document.activeElement === qEl) setSuggestOpen(true);
        });
        qEl.addEventListener("blur", () => {
          setTimeout(() => {
            if (document.activeElement === qEl) return;
            if (suggestEl && suggestEl.contains(document.activeElement)) return;
            setSuggestOpen(false);
          }, 140);
        });
        qEl.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            setSuggestOpen(false);
            return;
          }
          if (e.key === "ArrowDown" && suggestOpen && suggestItems.length) {
            e.preventDefault();
            suggestIndex = Math.min(suggestItems.length - 1, suggestIndex + 1);
            markActiveSuggest();
            return;
          }
          if (e.key === "ArrowUp" && suggestOpen && suggestItems.length) {
            e.preventDefault();
            suggestIndex = Math.max(0, suggestIndex - 1);
            markActiveSuggest();
            return;
          }
          if (e.key === "Enter") {
            e.preventDefault();
            if (suggestIndex >= 0 && suggestItems[suggestIndex]) {
              location.assign(suggestItems[suggestIndex].url);
              return;
            }
            go();
          }
        });
        if (suggestEl) {
          suggestEl.addEventListener("mousedown", (e) => e.preventDefault());
          suggestEl.addEventListener("click", (e) => {
            const item = e.target.closest(".suggest-item");
            if (!item) return;
            const hit = suggestItems[Number(item.getAttribute("data-idx"))];
            if (hit && hit.url) location.assign(hit.url);
          });
        }

        function stopDictation() {
          try {
            if (recorder && recorder.state !== "inactive") recorder.stop();
          } catch (_) {}
        }

        async function startDictation() {
          if (dictating || transcribing) return;
          const api = homeApi();
          if (!api.ensureMic || !api.transcribe || typeof MediaRecorder === "undefined") {
            showMsg("Dictation needs the LYKN desktop app.");
            return;
          }
          showMsg("");
          const allowed = await api.ensureMic();
          if (!allowed) {
            showMsg("Enable LYKN under System Settings → Privacy & Security → Microphone, then try again.");
            return;
          }
          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          } catch (_) {
            showMsg("Couldn't start the microphone. Check System Settings and try again.");
            return;
          }
          mediaStream = stream;
          audioChunks = [];
          recorder = new MediaRecorder(stream, { mimeType: RECORD_MIME });
          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) audioChunks.push(e.data);
          };
          recorder.onstop = async () => {
            try { mediaStream && mediaStream.getTracks().forEach((t) => t.stop()); } catch (_) {}
            mediaStream = null;
            recorder = null;
            dictating = false;
            const blob = new Blob(audioChunks, { type: RECORD_MIME });
            audioChunks = [];
            if (blob.size < 2000) {
              setMicState();
              return;
            }
            transcribing = true;
            setMicState();
            try {
              const buf = await blob.arrayBuffer();
              const res = await api.transcribe(buf, RECORD_MIME, qEl.value);
              if (res?.error) {
                showMsg(res.error);
              } else {
                const text = res && res.text ? String(res.text).trim() : "";
                if (text) {
                  const cur = qEl.value.trim();
                  qEl.value = cur ? `${cur} ${text}` : text;
                } else {
                  showMsg("Couldn't pick up any speech. Try again.");
                }
              }
            } catch (_) {
              showMsg("Transcription failed. Try again.");
            }
            transcribing = false;
            setMicState();
            qEl.focus();
          };
          recorder.onerror = () => {
            dictating = false;
            transcribing = false;
            setMicState();
          };
          recorder.start();
          dictating = true;
          setMicState();
        }

        mic.addEventListener("click", () => {
          if (transcribing) return;
          if (dictating) stopDictation();
          else void startDictation();
        });

        qEl.focus();
      })();
    </script>
  </body>
</html>
