<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Side-panel content card — its OWN vibrancy window floating next to
         the glass bar, exactly like the three-dot menu, view picker, and live
         notes cards (window-level vibrancy fills the whole window rect, so
         this can't live inside the overlay window without stretching it).
         Styling mirrors the chat card: native blur + the same tint/border.
         The section markup inside #body is pushed as HTML snapshots from the
         overlay renderer, so these classes mirror overlay.html exactly. */
      :root {
        --tint: rgba(16, 18, 24, 0.28);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f4f6fb;
        --muted: #aab2c2;
      }
      html.no-vibrancy {
        --tint: rgba(16, 18, 24, 0.82);
        --border: rgba(255, 255, 255, 0.16);
      }
      html.no-vibrancy,
      html.no-vibrancy body {
        background: transparent !important;
      }
      html.no-vibrancy #card {
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        clip-path: inset(0 round 16px);
      }
      * { box-sizing: border-box; }
      /* No scrollbar is ever drawn in LYKN: panes still scroll by wheel,
         trackpad, keyboard and drag, only the gutter is gone. This window has
         its own document, so it can't inherit the app-wide rule in index.css. */
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      *::-webkit-scrollbar {
        width: 0 !important;
        height: 0 !important;
        display: none !important;
      }
      html, body {
        margin: 0;
        height: 100%;
        width: 100%;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: var(--text);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Body copy (sources, notes, tasks) is highlightable; chrome stays locked. */
      #body .side-text-item,
      #body .side-summary,
      #body .side-title,
      #body .suggest-link-title,
      #body .suggest-link-domain {
        -webkit-user-select: text;
        user-select: text;
      }
      #head,
      #head *,
      #close,
      button,
      .suggest-link,
      .suggest-chip {
        -webkit-user-select: none;
        user-select: none;
      }
      #card {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--tint);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px 14px;
        overflow: hidden;
      }
      #head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      #title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #close {
        flex: none;
        display: grid;
        place-items: center;
        width: 20px; height: 20px;
        padding: 0;
        border: none;
        background: transparent;
        color: var(--muted);
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      #close:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); }
      #close svg { display: block; width: 14px; height: 14px; }
      #body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
      }

      /* ── Section markup mirrored from overlay.html ─────────────────── */
      .side-sec { margin-bottom: 14px; }
      .side-sec:last-child { margin-bottom: 0; }
      .side-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .side-list { display: flex; flex-direction: column; gap: 6px; }
      .side-empty {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        padding: 20px 10px;
      }
      .side-text-item {
        font-size: 12px;
        line-height: 1.45;
        color: var(--text);
        padding: 8px 10px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .side-summary {
        font-size: 12px;
        line-height: 1.5;
        color: var(--text);
        padding: 8px 10px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        white-space: pre-wrap;
      }

      /* Source link cards. */
      .suggest-link {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font: inherit;
        border-radius: 12px;
        padding: 8px 11px;
        cursor: pointer;
        text-align: left;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .suggest-link:hover {
        background: rgba(96, 165, 250, 0.12);
        border-color: rgba(96, 165, 250, 0.38);
      }
      .suggest-link:active { transform: translateY(1px); }
      .suggest-fav {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .suggest-fav-img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .suggest-fav.fallback { color: #60a5fa; }
      .suggest-fav.fallback svg { width: 16px; height: 16px; }
      .suggest-link-col {
        display: flex;
        flex-direction: column;
        min-width: 0;
        gap: 1px;
      }
      .suggest-link-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .suggest-link-domain {
        font-size: 11.5px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Follow-up chips. */
      .suggest-chip {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 7px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        border-radius: 9px;
        padding: 7px 10px;
        cursor: pointer;
        text-align: left;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .suggest-chip:hover {
        background: rgba(96, 165, 250, 0.14);
        border-color: rgba(96, 165, 250, 0.4);
      }
      .suggest-chip-ico { display: inline-flex; flex: none; color: var(--muted); }
      .suggest-chip-ico svg { width: 13px; height: 13px; }
      .suggest-chip:hover .suggest-chip-ico { color: #60a5fa; }

      /* Live watch feed items. */
      .watch-connected-banner {
        font-size: 11px;
        font-weight: 600;
        line-height: 1.4;
        color: #60a5fa;
        padding: 8px 10px;
        margin-bottom: 10px;
        border-radius: 8px;
        background: rgba(37, 99, 235, 0.12);
        border: 1px solid rgba(37, 99, 235, 0.22);
        text-align: center;
      }
      .watch-side-rules {
        font-size: 11px;
        line-height: 1.45;
        color: var(--muted);
        padding: 6px 8px;
        margin-bottom: 8px;
        border-radius: 8px;
        background: rgba(52, 211, 153, 0.08);
      }
      .watch-install-btn {
        display: block;
        width: 100%;
        margin: 0 0 10px;
        padding: 8px 10px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        background: #2563eb;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .watch-install-btn:hover { background: #1d4ed8; }
      .watch-side-item {
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .watch-side-item.system { opacity: 0.75; }
      .watch-side-item.alert {
        background: rgba(251, 191, 36, 0.1);
        border-color: rgba(251, 191, 36, 0.28);
      }
      .watch-side-meta {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #34d399;
        margin-bottom: 4px;
      }
      .watch-side-item.alert .watch-side-meta { color: #fbbf24; }
      .watch-side-item.system .watch-side-meta { color: var(--muted); }
      .watch-side-text {
        font-size: 13px;
        line-height: 1.45;
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
    <link rel="stylesheet" href="hover-tips.css" />
  </head>
  <body>
    <div id="card">
      <div id="head">
        <span id="title">Sources</span>
        <button id="close" type="button" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="body"></div>
    </div>
    <script src="hover-tips.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
