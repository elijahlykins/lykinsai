<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrome Live Feed</title>
    <style>
      :root {
        --bg: #0b0b0f;
        --text: #f4f4f6;
        --muted: rgba(244, 244, 246, 0.55);
        --blue: #2563eb;
        --blue-hover: #1d4ed8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: radial-gradient(900px 500px at 50% -30%, #16161f 0%, var(--bg) 70%);
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 36px 32px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        user-select: none;
      }
      .brand { margin-bottom: 24px; }
      .logo {
        display: block;
        width: 160px;
        height: auto;
        margin: 0 auto;
      }
      .tagline {
        margin: 0 0 28px;
        font-size: 14px;
        line-height: 1.55;
        color: var(--muted);
        max-width: 300px;
      }
      .tagline strong {
        display: block;
        margin-top: 10px;
        color: var(--text);
        font-weight: 600;
      }
      button.install {
        appearance: none;
        border: none;
        border-radius: 12px;
        padding: 14px 24px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        background: var(--blue);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
        min-width: 240px;
      }
      button.install:hover { background: var(--blue-hover); }
      button.install:disabled { opacity: 0.55; cursor: wait; }
    </style>
  </head>
  <body>
    <div class="brand">
      <img
        class="logo"
        src="./resources/lykn-logo-primary-blue.png"
        alt="LYKN"
        width="160"
        height="48"
      />
    </div>

    <p class="tagline">
      Allow LYKN to have live feed when you turn it on.
      <strong>You stay in control.</strong>
    </p>

    <button id="install" class="install" type="button">Add Chrome Live Feed</button>

    <script>
      const api = window.lyknExtensionInstall;
      const installBtn = document.getElementById("install");
      let installing = false;

      async function refreshConn() {
        const s = await api.bridgeStatus();
        if (s.connected) setTimeout(() => api.close(), 600);
      }

      async function runInstall() {
        if (installing) return;
        installing = true;
        installBtn.disabled = true;
        try {
          await api.installOneClick("chrome");
        } catch (_) {}
        finally {
          installing = false;
          installBtn.disabled = false;
          installBtn.textContent = "Try again";
        }
        refreshConn();
      }

      installBtn.addEventListener("click", runInstall);
      setInterval(refreshConn, 2000);
    </script>
  </body>
</html>
