<!doctype html>
<html data-theme="light">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Dia-style light chrome: warm-gray strip, white active tab, white page */
      :root,
      html[data-theme="light"] {
        --bg: #f3f2f0;
        --bar: #f3f2f0;
        --tab: transparent;
        --tab-active: #ffffff;
        --border: rgba(0, 0, 0, 0.08);
        --text: #1c1c1c;
        --muted: #6f6f6f;
        --chrome: #f3f2f0;
        --url-bg: transparent;
        --url-bg-focus: #ffffff;
        --btn-bg: rgba(0, 0, 0, 0.05);
        --btn-hover: rgba(0, 0, 0, 0.07);
        --page: #ffffff;
        --tab-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.06);
        --stamp-hi: rgba(255, 255, 255, 0.92);
        --stamp-lo: rgba(0, 0, 0, 0.18);
        --stamp-hi-soft: rgba(255, 255, 255, 0.45);
        --stamp-lo-soft: rgba(0, 0, 0, 0.08);
      }
      html[data-theme="incognito"] {
        --bg: #1e1e1e;
        --bar: #242424;
        --tab: transparent;
        --tab-active: #383838;
        --border: rgba(255, 255, 255, 0.1);
        --text: #fafafa;
        --muted: #a3a3a3;
        --chrome: #242424;
        --url-bg: transparent;
        --url-bg-focus: rgba(0, 0, 0, 0.4);
        --btn-bg: rgba(255, 255, 255, 0.06);
        --btn-hover: rgba(255, 255, 255, 0.12);
        --page: #1e1e1e;
        --tab-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.25);
        --stamp-hi: rgba(255, 255, 255, 0.16);
        --stamp-lo: rgba(0, 0, 0, 0.78);
        --stamp-hi-soft: rgba(255, 255, 255, 0.07);
        --stamp-lo-soft: rgba(0, 0, 0, 0.42);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #shell {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      /* ── Tab strip — floating rounded tabs, Dia/Arc style ── */
      #tabrow {
        display: flex;
        align-items: center;
        background: var(--bar);
      }
      #tabs {
        display: flex;
        align-items: center;
        gap: 3px;
        flex: 1 1 auto;
        min-width: 0;
        height: 42px;
        padding: 6px 8px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-app-region: drag;
        scrollbar-width: none;
      }
      /* ── Window controls. Docked in the Studio the strip is the floating
         Browser window's title bar, so it carries the traffic lights and the
         drag itself; the standalone stage window has a real title bar and
         hides all of this. The frame is out in the Studio's DOM, under this
         view, so every one of these goes back to it over IPC. ── */
      #winbtns { display: none; }
      html.docked #winbtns {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
        height: 42px;
        padding: 0 4px 0 13px;
        -webkit-app-region: no-drag;
      }
      .winbtn {
        width: 12px;
        height: 12px;
        padding: 0;
        border: none;
        border-radius: 50%;
        display: grid;
        place-items: center;
        cursor: default;
      }
      .winbtn svg {
        width: 8px;
        height: 8px;
        opacity: 0;
        transition: opacity 120ms ease;
      }
      #winbtns:hover .winbtn svg { opacity: 0.6; }
      .winbtn:active { transform: scale(0.92); }
      /* Dragging is ours to run when docked — an app-region would haul the
         whole Studio window around instead of this one. */
      html.docked #tabs,
      html.docked #tabrow { -webkit-app-region: no-drag; }
      #tabs::-webkit-scrollbar { display: none; }
      .tab {
        -webkit-app-region: no-drag;
        flex: 0 1 190px;
        max-width: 210px;
        min-width: 96px;
        height: 30px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 7px 0 10px;
        border: none;
        border-radius: 9px;
        background: var(--tab);
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        text-align: left;
      }
      .tab:hover { color: var(--text); background: var(--btn-bg); }
      .tab.active {
        background: var(--tab-active);
        color: var(--text);
        box-shadow: var(--tab-shadow);
      }
      /* New tabs ease out of the chrome instead of snapping into the strip. */
      .tab.opening {
        animation: tab-open 320ms cubic-bezier(0.16, 1, 0.3, 1) both;
        will-change: opacity, transform;
      }
      @keyframes tab-open {
        from {
          opacity: 0;
          transform: translateY(-7px) scale(0.975);
        }
        70% {
          opacity: 1;
          transform: translateY(1px) scale(1.003);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .tab.opening { animation: none; }
      }
      /* Close button rides on hover / active only — Dia keeps tabs quiet. */
      .tab .tab-x { display: none; }
      .tab:hover .tab-x,
      .tab.active .tab-x { display: grid; }
      .tab-new {
        -webkit-app-region: no-drag;
        flex: none;
        width: 28px;
        height: 28px;
        margin-left: 3px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 17px;
        font-weight: 450;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0 0 2px;
      }
      .tab-new:hover {
        color: var(--text);
        background: var(--btn-bg);
      }
      .tab.artifact .tab-label::before {
        content: "◆ ";
        font-size: 9px;
        opacity: 0.7;
      }
      /* Deliverable subtab — nests under its owner tab: shorter, indented
         with a connector arrow, sits tight against the parent. */
      .tab.subtab {
        flex: 0 1 150px;
        min-width: 84px;
        max-width: 170px;
        height: 26px;
        border-radius: 8px;
        font-size: 11px;
      }
      .tab.subtab .tab-label::before {
        content: "↳ ";
        font-size: 10px;
        opacity: 0.7;
      }
      .tab-favicon {
        flex: none;
        width: 15px;
        height: 15px;
        border-radius: 3px;
        object-fit: contain;
        background: transparent;
      }
      .tab-favicon-fallback {
        display: grid;
        place-items: center;
        color: var(--muted);
        opacity: 0.75;
      }
      .tab-favicon-fallback svg {
        width: 12px;
        height: 12px;
        display: block;
      }
      .tab-favicon-fallback.lykn {
        opacity: 0.9;
      }
      .tab-favicon-fallback.lykn svg {
        width: 13px;
        height: 13px;
      }
      .tab-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tab-x {
        flex: none;
        width: 16px;
        height: 16px;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
        opacity: 0.55;
      }
      .tab-x:hover { opacity: 1; background: var(--btn-hover); }
      .tab-x svg { width: 10px; height: 10px; display: block; }
      /* ── Nav row — round icon buttons + quiet omnibox ── */
      #chrome {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 10px;
        background: var(--chrome);
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
      }
      #chrome button, #chrome input { -webkit-app-region: no-drag; }
      #chrome button {
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      #chrome button:hover { background: var(--btn-hover); color: var(--text); }
      #chrome button.active {
        background: var(--btn-hover);
        color: var(--text);
      }
      #chrome svg { width: 15px; height: 15px; display: block; }
      #incognito svg { width: 16px; height: 16px; }
      /* Ask Gemini–style entry point — opens Studio agent chat. */
      #chrome button#use-lykn {
        width: auto;
        height: 28px;
        flex: none;
        border-radius: 999px;
        padding: 0 11px 0 9px;
        gap: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.01em;
        white-space: nowrap;
        -webkit-app-region: no-drag;
      }
      #chrome button#use-lykn:hover { background: var(--btn-hover); }
      #chrome button#use-lykn.active {
        background: var(--btn-hover);
        border-color: color-mix(in srgb, var(--text) 28%, var(--border));
      }
      #chrome button#use-lykn svg {
        width: 14px;
        height: 14px;
        flex: none;
      }
      #chrome button#use-lykn .label { line-height: 1; }
      #url-wrap {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        margin: 0 6px;
      }
      #url-field {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
      }
      #url {
        flex: 1;
        min-width: 0;
        width: 100%;
        height: 30px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: var(--url-bg);
        color: var(--muted);
        padding: 0 10px;
        font: inherit;
        font-size: 12.5px;
        outline: none !important;
        outline-offset: 0;
        box-shadow: none !important;
        -webkit-appearance: none;
        -webkit-tap-highlight-color: transparent;
      }
      #url:hover { background: var(--btn-bg); }
      #url:focus,
      #url:focus-visible,
      #url:active {
        outline: none !important;
        border-color: var(--border);
        background: var(--url-bg-focus);
        color: var(--text);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 14px rgba(0, 0, 0, 0.07) !important;
      }
      /* Kill Chromium's yellow/orange autofill wash + focus tint. */
      #url:-webkit-autofill,
      #url:-webkit-autofill:hover,
      #url:-webkit-autofill:focus,
      #url:-webkit-autofill:active {
        -webkit-text-fill-color: var(--text) !important;
        caret-color: var(--text);
        border-color: var(--border) !important;
        /* Paint the field bg over the autofill color. */
        -webkit-box-shadow: 0 0 0 1000px var(--url-bg-focus) inset !important;
        box-shadow: 0 0 0 1000px var(--url-bg-focus) inset !important;
        transition: background-color 99999s ease-out;
      }
      /* Google-style omnibox suggestions — short + scrollable so the list
         never runs off the bottom of the Studio browser panel. */
      #url-suggest {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 6px);
        max-height: min(220px, 32vh);
        overflow-y: auto;
        overscroll-behavior: contain;
        background: var(--tab-active);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.06),
          0 8px 24px rgba(0, 0, 0, 0.12);
        z-index: 60;
        padding: 6px 0;
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 0, 0, 0.28) transparent;
      }
      html[data-theme="incognito"] #url-suggest {
        scrollbar-color: rgba(255, 255, 255, 0.28) transparent;
      }
      #url-suggest::-webkit-scrollbar {
        width: 8px;
      }
      #url-suggest::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.22);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      html[data-theme="incognito"] #url-suggest::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.22);
        background-clip: padding-box;
      }
      #url-suggest[hidden] { display: none; }
      #url-suggest .suggest-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 44px;
        border: none;
        border-radius: 0;
        background: transparent;
        color: var(--text);
        text-align: left;
        padding: 8px 16px;
        cursor: pointer;
        font: inherit;
      }
      #url-suggest .suggest-item:hover,
      #url-suggest .suggest-item.active {
        background: rgba(0, 0, 0, 0.05);
      }
      html[data-theme="incognito"] #url-suggest .suggest-item:hover,
      html[data-theme="incognito"] #url-suggest .suggest-item.active {
        background: rgba(255, 255, 255, 0.08);
      }
      #url-suggest .suggest-ico {
        flex: none;
        width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
        color: var(--muted);
        opacity: 0.9;
      }
      #url-suggest .suggest-ico svg {
        display: block;
        width: 18px;
        height: 18px;
      }
      #url-suggest .suggest-ico img {
        display: block;
        width: 16px;
        height: 16px;
        border-radius: 3px;
        object-fit: contain;
      }
      #url-suggest .suggest-item .meta {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #url-suggest .suggest-item .name {
        font-size: 13px;
        font-weight: 400;
        line-height: 1.25;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
      }
      #url-suggest .suggest-item .host {
        font-size: 12px;
        font-weight: 400;
        line-height: 1.25;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* ── Favorites bar — favicon + label chips, like a bookmarks bar ── */
      #favs {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 33px;
        padding: 0 8px 4px;
        background: var(--bar);
        border-bottom: 1px solid var(--border);
        overflow: hidden;
        -webkit-app-region: drag;
      }
      #favs[hidden] { display: none; }
      #favs-scroll {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
        scroll-behavior: smooth;
      }
      #favs-scroll::-webkit-scrollbar { display: none; }
      .fav {
        -webkit-app-region: no-drag;
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 26px;
        max-width: 170px;
        padding: 0 10px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      .fav:hover { background: var(--btn-bg); }
      .fav img {
        flex: none;
        width: 14px;
        height: 14px;
        border-radius: 3px;
        object-fit: contain;
      }
      .fav .fav-fallback {
        flex: none;
        width: 14px;
        height: 14px;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .fav .fav-fallback svg { width: 12px; height: 12px; display: block; }
      .fav .fav-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #favs-more {
        -webkit-app-region: no-drag;
        flex: none;
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
      }
      #favs-more:hover { background: var(--btn-bg); color: var(--text); }
      #favs-more svg { width: 13px; height: 13px; display: block; }
      #sync-menu {
        position: absolute;
        top: 40px;
        right: 12px;
        width: min(320px, calc(100vw - 24px));
        background: var(--tab-active);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
        z-index: 40;
        padding: 14px;
      }
      #sync-menu[hidden] { display: none; }
      #sync-menu .sync-head {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 4px;
      }
      #sync-menu .sync-sub {
        margin: 0 0 12px;
        font-size: 11.5px;
        line-height: 1.45;
        color: var(--muted);
      }
      #sync-menu select {
        width: 100%;
        height: 30px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--url-bg-focus);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        padding: 0 8px;
        margin-bottom: 10px;
      }
      #sync-menu .sync-opt {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text);
        padding: 4px 0;
        cursor: pointer;
      }
      #sync-menu .sync-opt input { accent-color: #3b78ff; }
      #sync-menu .sync-run {
        width: 100%;
        height: 32px;
        margin-top: 12px;
        border: none;
        border-radius: 8px;
        background: #3b78ff;
        color: #fff;
        font: inherit;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }
      #sync-menu .sync-run:hover { background: #2f6ae6; }
      #sync-menu .sync-run:disabled { opacity: 0.6; cursor: default; }
      #sync-menu .sync-status {
        margin: 10px 0 0;
        font-size: 11.5px;
        line-height: 1.45;
        color: var(--muted);
      }
      #sync-menu .sync-status.error { color: #d9534f; }
      #sync-menu .sync-status.ok { color: #2e9e5b; }
      #sync-btn.active { background: var(--btn-hover); }
      #chrome { position: relative; }
      #page {
        flex: 1;
        min-height: 0;
        background: var(--page);
      }
      /* ── Empty state (no tabs yet) — Dia-style new-tab backdrop ── */
      #empty {
        height: 100%;
        display: grid;
        place-content: center;
        justify-items: center;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        padding: 24px;
        line-height: 1.45;
        background: #f3f2f0;
      }
      html[data-theme="incognito"] #empty {
        background: var(--page);
      }
      /* The LYKN mark on its own. */
      #empty-stamp {
        width: 84px;
        height: 84px;
        margin-bottom: 26px;
      }
      #empty-stamp svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #empty-stamp path { fill: #5a8fd0; }
      html[data-theme="incognito"] #empty-stamp path { fill: rgba(220, 235, 255, 0.7); }
      #empty .title {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.28em 0.35em;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.02em;
        color: var(--text);
        margin-bottom: 8px;
      }
      #empty .title .wordmark {
        display: inline-block;
        /* ViewBox has vertical padding — scale so glyph height matches surrounding type. */
        height: 1.35em;
        width: auto;
        color: var(--text);
      }
      #empty .title .wordmark path {
        fill: currentColor;
      }
      #empty[hidden] { display: none; }
      #toast { display: none !important; }
      /* Saved-links dropdown open: main.cjs overlays this document above the
         page view — go transparent outside the bars/menu so the page shows. */
      html.menu-overlay,
      html.menu-overlay body { background: transparent; }
      html.menu-overlay #page { background: transparent; }
      html.menu-overlay #empty { visibility: hidden; }
    </style>
    <link rel="stylesheet" href="hover-tips.css" />
  </head>
  <body>
    <div id="shell">
      <div id="toast" hidden></div>
      <div id="tabrow">
        <div id="winbtns" aria-label="Window controls">
          <button type="button" class="winbtn" id="win-close" title="Close" aria-label="Close" style="background:#ff5f57">
            <svg viewBox="0 0 10 10" fill="none" stroke="rgba(0,0,0,0.75)" stroke-width="1.4" stroke-linecap="round"><path d="M2 2 L8 8 M8 2 L2 8"/></svg>
          </button>
          <button type="button" class="winbtn" id="win-min" title="Minimize" aria-label="Minimize" style="background:#febc2e">
            <svg viewBox="0 0 10 10" fill="none" stroke="rgba(0,0,0,0.75)" stroke-width="1.4" stroke-linecap="round"><path d="M2 5 H8"/></svg>
          </button>
          <button type="button" class="winbtn" id="win-zoom" title="Zoom" aria-label="Zoom" style="background:#28c840">
            <svg viewBox="0 0 10 10" fill="none" stroke="rgba(0,0,0,0.75)" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 7.5 L7.5 2.5 M3 3 H7 V7"/></svg>
          </button>
        </div>
        <div id="tabs" aria-label="Agent tabs"></div>
      </div>
      <div id="chrome">
        <button type="button" id="back" title="Back" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button type="button" id="forward" title="Forward" aria-label="Forward">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button type="button" id="reload" title="Reload" aria-label="Reload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
