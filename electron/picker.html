<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Side-panel view picker card — its OWN vibrancy window floating next
         to the glass bar, exactly like the three-dot menu card (menu.html):
         window-level vibrancy fills the whole window rect, so an in-window
         drawer could never float on a transparent gap. Styling mirrors the
         chat card: native blur + the same tint/border. */
      :root {
        --tint: rgba(16, 18, 24, 0.28);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f4f6fb;
        --muted: #aab2c2;
      }
      html.no-vibrancy {
        --tint: rgba(18, 20, 28, 0.52);
        --border: rgba(255, 255, 255, 0.2);
      }
      html.no-vibrancy,
      html.no-vibrancy body {
        background: transparent !important;
      }
      html.no-vibrancy #card {
        background:
          linear-gradient(
            165deg,
            rgba(255, 255, 255, 0.18) 0%,
            rgba(255, 255, 255, 0.05) 38%,
            rgba(10, 12, 18, 0.35) 100%
          ),
          rgba(18, 20, 28, 0.55);
        border: 1px solid var(--border);
        backdrop-filter: blur(48px) saturate(180%);
        -webkit-backdrop-filter: blur(48px) saturate(180%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.22),
          0 18px 48px rgba(0, 0, 0, 0.5);
        isolation: isolate;
        transform: translateZ(0);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        width: 100%;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: var(--text);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #card {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--tint);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 6px;
        overflow: hidden;
      }
      #options {
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }
      #options::-webkit-scrollbar { width: 6px; }
      #options::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 999px;
      }
      .picker-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        border: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-weight: 500;
        text-align: left;
        padding: 7px 10px;
        border-radius: 9px;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .picker-item:hover { background: rgba(255, 255, 255, 0.1); }
      .picker-item.active { background: rgba(96, 165, 250, 0.12); color: #93c5fd; }
      .picker-item.empty { color: rgba(255, 255, 255, 0.42); }
      .picker-item .count {
        font-size: 11px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.38);
        flex: none;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="options" role="listbox"></div>
    </div>
    <script src="picker.js"></script>
  </body>
</html>
