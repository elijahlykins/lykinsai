<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent browser</title>
    <style>
      /* Match Mac app theme.js: light #ececeb · dark #1e1e1e */
      :root,
      html[data-theme="light"] {
        --bg: #ececeb;
        --text: rgba(15, 15, 15, 0.92);
        --muted: rgba(15, 15, 15, 0.5);
        /* Deboss / stamp lighting (light from top-left) */
        --stamp-hi: rgba(255, 255, 255, 0.92);
        --stamp-lo: rgba(0, 0, 0, 0.18);
        --stamp-hi-soft: rgba(255, 255, 255, 0.45);
        --stamp-lo-soft: rgba(0, 0, 0, 0.08);
        --grain: rgba(0, 0, 0, 0.035);
      }
      html[data-theme="incognito"],
      html[data-theme="dark"] {
        --bg: #1e1e1e;
        --text: rgba(250, 250, 250, 0.92);
        --muted: rgba(250, 250, 250, 0.55);
        --stamp-hi: rgba(255, 255, 255, 0.16);
        --stamp-lo: rgba(0, 0, 0, 0.78);
        --stamp-hi-soft: rgba(255, 255, 255, 0.07);
        --stamp-lo-soft: rgba(0, 0, 0, 0.42);
        --grain: rgba(255, 255, 255, 0.03);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      .stage {
        position: relative;
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 40px 24px 48px;
        background: var(--bg);
      }
      /* Fine paper grain so the stamp reads as pressed into a surface */
      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 180px 180px;
        mix-blend-mode: soft-light;
        opacity: 0.45;
      }
      .mark {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        text-align: center;
        max-width: 420px;
      }
      /*
        Stamped / debossed mark: fill = page bg, form only from highlight + shadow
        (same idea as letterpress inset — not a chrome render).
      */
      .stamp {
        width: min(300px, 58vw);
        height: min(300px, 58vw);
        color: var(--bg);
        filter:
          drop-shadow(1.4px 1.4px 0.4px var(--stamp-hi))
          drop-shadow(-1.6px -1.6px 0.7px var(--stamp-lo))
          drop-shadow(2.8px 2.8px 1.6px var(--stamp-hi-soft))
          drop-shadow(-2.8px -2.8px 2.2px var(--stamp-lo-soft));
      }
      .stamp svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .stamp path {
        fill: currentColor;
      }
      .copy h1 {
        margin: 0 0 8px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.28em 0.35em;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1.25;
        color: var(--text);
      }
      .copy h1 .wordmark {
        display: inline-block;
        /* ViewBox has vertical padding — scale so glyph height matches surrounding type. */
        height: 1.35em;
        width: auto;
        vertical-align: middle;
        color: var(--text);
      }
      .copy h1 .wordmark path {
        fill: currentColor;
      }
      .copy p {
        margin: 0;
        font-size: 14px;
        line-height: 1.45;
        color: var(--muted);
        max-width: 320px;
      }
      .badge {
        display: none;
        margin-top: 14px;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      html[data-theme="incognito"] .badge,
      html[data-theme="dark"] .badge {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="mark">

              />
            </svg>
            <span>browser</span>
          </h1>
          <p>Ask LYKN to open a site, research, or build. This tab is ready when you are.</p>
          <div class="badge">Incognito</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          const q = new URLSearchParams(location.search || "");
          const theme = (q.get("theme") || "").toLowerCase();
          const dark =
            theme === "incognito" ||
            theme === "dark" ||
            q.get("incognito") === "1";
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "incognito" : "light",
          );
        } catch (_) {}
      })();
    </script>
  </body>
</html>
