<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Language picker — own vibrancy window under the Translate "To" pill.
         Same rationale as menu/picker: macOS vibrancy fills the HWND, so an
         in-bar dropdown can't hang on a transparent gap. */
      :root {
        --tint: rgba(16, 18, 24, 0.28);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f4f6fb;
      }
      html.no-vibrancy {
        --tint: rgba(16, 18, 24, 0.82);
        --border: rgba(255, 255, 255, 0.16);
      }
      html.no-vibrancy,
      html.no-vibrancy body {
        background: transparent !important;
      }
      html.no-vibrancy #card {
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        clip-path: inset(0 round 14px);
      }
      * { box-sizing: border-box; }
      /* No scrollbar is ever drawn in LYKN: panes still scroll by wheel,
         trackpad, keyboard and drag, only the gutter is gone. This window has
         its own document, so it can't inherit the app-wide rule in index.css. */
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      *::-webkit-scrollbar {
        width: 0 !important;
        height: 0 !important;
        display: none !important;
      }
      html, body {
        margin: 0;
        height: 100%;
        width: 100%;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        color: var(--text);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #card {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--tint);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 4px;
        overflow: hidden;
      }
      #options {
        display: flex;
        flex-direction: column;
        gap: 1px;
        overflow-y: auto;
        max-height: 100%;
      }
      .lang-item {
        display: block;
        width: 100%;
        border: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-weight: 500;
        text-align: left;
        padding: 7px 10px;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      .lang-item:hover { background: rgba(255, 255, 255, 0.1); }
      .lang-item.active {
        background: rgba(255, 255, 255, 0.12);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="options" role="listbox" aria-label="Target language"></div>
    </div>
    <script src="lang-picker.js"></script>
  </body>
</html>
