<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --tint: rgba(16, 18, 24, 0.28);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f4f6fb;
        --muted: #aab2c2;
      }
      html.no-vibrancy {
        --tint: rgba(16, 18, 24, 0.82);
        --border: rgba(255, 255, 255, 0.16);
      }
      html.no-vibrancy,
      html.no-vibrancy body {
        background: transparent !important;
      }
      html.no-vibrancy .banner {
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        clip-path: inset(0 round 16px);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        color: var(--text);
      }
      .wrap {
        height: 100%;
        box-sizing: border-box;
        padding: 0;
        display: flex;
        justify-content: stretch;
        align-items: stretch;
      }
      .banner {
        width: 100%;
        height: 100%;
        padding: 12px 16px 13px;
        border-radius: 16px;
        border: 1px solid var(--border);
        outline: none;
        background: var(--tint);
        color: var(--text);
        cursor: pointer;
        user-select: none;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        overflow: hidden;
        animation: in 0.22s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      .banner:active {
        transform: scale(0.985);
      }
      .head {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: none;
        min-height: 18px;
      }
      .icon {
        width: 18px;
        height: 18px;
        flex: none;
        color: var(--muted);
        display: grid;
        place-items: center;
      }
      .icon svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      .app {
        flex: 1;
        min-width: 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        line-height: 1.35;
        padding-right: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .when {
        flex: none;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.35;
        color: var(--muted);
      }
      .prompt {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: 0;
        color: var(--text);
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .status {
        font-size: 12px;
        font-weight: 500;
        line-height: 1.4;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding-right: 2px;
      }
      .status.ok { color: #86efac; }
      .status.fail { color: #fca5a5; }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="banner" id="banner" title="Open agent">
        <div class="head">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4.5" width="18" height="15" rx="2.5"/>
              <path d="M3 9h18"/>
              <circle cx="6.2" cy="6.75" r="0.7" fill="currentColor" stroke="none"/>
              <circle cx="8.6" cy="6.75" r="0.7" fill="currentColor" stroke="none"/>
              <circle cx="11" cy="6.75" r="0.7" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <div class="app">LYKN</div>
          <div class="when">now</div>
        </div>
        <div class="prompt" id="prompt">Agent task</div>
        <div class="status" id="status">Finished</div>
      </div>
    </div>
    <script>
      if (navigator.userAgent.includes("Windows") || navigator.userAgent.includes("Linux")) {
        document.documentElement.classList.add("no-vibrancy");
      }
      const params = new URLSearchParams(location.search);
      const prompt = (params.get("prompt") || params.get("name") || "Agent task").trim();
      const status = (params.get("status") || "Finished").trim();
      const ok = params.get("ok") !== "0";
      const agentId = params.get("agentId") || "";
      document.getElementById("prompt").textContent = prompt;
      const statusEl = document.getElementById("status");
      statusEl.textContent = status;
      statusEl.classList.add(ok ? "ok" : "fail");
      const banner = document.getElementById("banner");
      banner.dataset.agentId = agentId;
      let opened = false;
      const open = (e) => {
        if (opened) return;
        opened = true;
        try {
          e?.preventDefault?.();
          e?.stopPropagation?.();
        } catch (_) {}
        window.lyknFinishedPopup?.openAgent(agentId || banner.dataset.agentId || "");
      };
      // pointerdown: macOS panel windows often eat the first click otherwise.
      banner.addEventListener("pointerdown", open);
      banner.addEventListener("click", open);
      // Window hide is owned by main — do not fade content alone (leaves glass ghost).
    </script>
  </body>
</html>
