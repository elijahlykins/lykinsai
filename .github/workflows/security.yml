# ============================================================================
# .github/workflows/security.yml — CI security gates (Agent 06)
# ============================================================================
# Three independent jobs run on every push to main and every PR:
#
#   1. gitleaks            — full-history secret scan (second gate after the
#                            local pre-commit hook installed by Agent 05).
#   2. dependency-audit    — `npm audit --json` filtered against the
#                            Accepted-Risk list (xlsx, quill, react-quill —
#                            see SECURITY_REPORT_05.md). Fails the build on
#                            any NEW HIGH/CRITICAL that isn't on that list,
#                            so a freshly-disclosed CVE in xlsx / quill /
#                            react-quill still surfaces (we just don't fail
#                            on the already-accepted advisories).
#   3. anon-permission-probe — hits every admin RPC, internal write fn, and
#                            dropped reporting view with the public anon JWT
#                            and asserts each one is denied. Regression gate
#                            for the migration-068 vulnerability where anon
#                            could read every user's email + AI spend through
#                            five SECURITY DEFINER admin RPCs. See
#                            scripts/anon-permission-probe.mjs and
#                            supabase-migrations/068_lock_down_anon_functions.sql.
#
# Every third-party Action is PINNED TO A COMMIT SHA (supply-chain hardening
# for the CI itself — a compromised v4 tag can't ship malicious code if we
# pin the SHA). Comments next to each SHA show the human-readable version
# tag at pinning time so future bumps are obvious.
#
# CIA: Integrity (no new secrets or CVEs slip into main),
#      Confidentiality (gitleaks blocks pre-merge).
# Principle: DiD (CI gate after pre-commit hook), SbD.
#
# LYKN Security Plan — Agent 06 of 6

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily 03:00 UTC scheduled run on main — catches new CVEs disclosed
    # against deps we haven't touched in a while. Same job, no changes.
    - cron: '0 3 * * *'

jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history for gitleaks)
        # actions/checkout@v4 — pinned to commit SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # gitleaks/gitleaks-action@v2 — pinned to commit SHA
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Optional: set GITLEAKS_LICENSE in repo secrets for organizations;
          # gitleaks-action is free for solo / sub-15-user orgs without one.

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout@v4 — pinned to commit SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node 20
        # actions/setup-node@v4 — pinned to commit SHA
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          # `|| true` so the next step actually runs even when npm audit
          # exits non-zero (which it does on any vuln). The Node script
          # below decides whether to fail the build.
          npm audit --audit-level=high --json > audit-results.json || true

      - name: Filter against Accepted-Risk list
        run: |
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("audit-results.json", "utf8"));
            // Accepted-risk packages — Agent 05 documented these as
            // intentional deferrals with mitigation in place. New CVEs in
            // these packages still surface in the JSON artifact uploaded
            // below; we just dont fail CI on the already-accepted ones.
            const ACCEPTED = ["xlsx", "quill", "react-quill"];
            const vulns = r.vulnerabilities || {};
            const failures = [];
            for (const [name, v] of Object.entries(vulns)) {
              const sev = String(v.severity || "").toLowerCase();
              if (sev !== "high" && sev !== "critical") continue;
              const accepted = ACCEPTED.some(a => name === a || (v.name && v.name.includes(a)));
              if (accepted) {
                console.log(`accepted-risk: ${name} (${sev}) — see SECURITY_REPORT_05.md`);
                continue;
              }
              failures.push({ name, severity: sev, via: (v.via || []).slice(0, 5) });
            }
            if (failures.length > 0) {
              console.error("");
              console.error(`UNACCEPTED HIGH/CRITICAL vulnerabilities found (${failures.length}):`);
              for (const f of failures) {
                console.error(`  - ${f.name} (${f.severity})`);
              }
              console.error("");
              console.error("Either fix them, or — if the risk is genuinely acceptable —");
              console.error("add to the ACCEPTED list in .github/workflows/security.yml");
              console.error("AND document the mitigation in SECURITY_REPORT_05.md.");
              process.exit(1);
            }
            console.log("npm audit clean (accepted-risk packages excluded).");
          '

      - name: Upload audit-results.json artifact
        if: always()
        # actions/upload-artifact@v4 — pinned to commit SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-audit-results
          path: audit-results.json
          retention-days: 30

  anon-permission-probe:
    # Regression gate for the migration-068 anon-RPC info-disclosure bug.
    # If this job ever fails, a future migration has re-granted the anon
    # role EXECUTE on a surface that should be authenticated-only or
    # service-role-only. Treat a failure here as a P0 — the script names
    # the offending RPC/view so you can pinpoint the regressing migration.
    name: Anon permission probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout@v4 — pinned to commit SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node 20
        # actions/setup-node@v4 — pinned to commit SHA
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (dotenv only — script has no other deps)
        run: npm ci

      - name: Skip if Supabase secrets are not configured
        id: gate
        run: |
          if [ -z "${{ secrets.PROBE_SUPABASE_URL }}" ] || [ -z "${{ secrets.PROBE_SUPABASE_ANON_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PROBE_SUPABASE_URL / PROBE_SUPABASE_ANON_KEY repo secrets not set — skipping probe."
            echo "::warning::Configure them in repo Settings → Secrets → Actions to enable the regression gate."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run probe against production Supabase
        if: steps.gate.outputs.configured == 'true'
        env:
          # Use repo secrets, NOT the running app's env vars. We deliberately
          # point this at the production project so a regression on prod
          # fails CI even when the regressing PR doesn't touch supabase config.
          VITE_SUPABASE_URL: ${{ secrets.PROBE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROBE_SUPABASE_ANON_KEY }}
        run: node scripts/anon-permission-probe.mjs
